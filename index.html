    (remoteList || []).forEach((r) => {
      if (!r || !r.id) return;
      const loc = map[r.id];
      const queued = pending[r.id];
      if (queued && newer(queued, r)) {
        map[r.id] = queued;
        return;
      }
      if (!loc) map[r.id] = r;
      else if (newer(r, loc)) map[r.id] = r;
    });
    return Object.keys(map).map((k) => map[k]);
  }

  function rosterToDiver(row) {
    const empty = C && C.emptyDiver ? C.emptyDiver : function (x) { return Object.assign({}, x); };
    const pay = C && C.normalizePayment
      ? C.normalizePayment({
          status: row.payStatus,
          amount: row.payAmount,
          collected: row.payCollected,
          method: row.payMethod,
          note: row.payNote,
        })
      : { status: row.payStatus || "unpaid", amount: row.payAmount, collected: row.payCollected, method: row.payMethod, note: row.payNote };
    const d = empty({
      id: row.id,
      customerId: row.customerId,
      name: row.name,
      phone: row.phone,
      address: row.address,
      certLevel: row.certLevel,
      certAgency: row.certAgency,
      certNumber: row.certNumber,
      emergencyName: row.emergencyName,
      emergencyPhone: row.emergencyPhone,
      notes: row.notes,
      attendance: row.attendance,
      checkedInAt: row.checkedInAt || null,
      activity: row.activity,
      instructor: row.instructor,
      course: row.course,
      addedVia: row.addedVia,
      addedAt: row.addedAt,
      updatedAt: row.updatedAt,
      updatedBy: row.updatedBy,
      payment: pay,
    });
    d.deleted = asBool(row.deleted);
    return d;
  }

  function rowToCustomer(row) {
    const empty = C && C.emptyCustomer ? C.emptyCustomer : function (x) { return Object.assign({}, x); };
    const c = empty(row);
    c.updatedAt = row.updatedAt;
    c.updatedBy = row.updatedBy;
    c.deleted = asBool(row.deleted);
    if (typeof row.importedVisits === "string") {
      try { c.importedVisits = JSON.parse(row.importedVisits); } catch (e) { c.importedVisits = c.importedVisits || []; }
    }
    return c;
  }

  function rowToTrip(row) {
    const empty = C && C.emptyTrip ? C.emptyTrip : function (x) { return Object.assign({ divers: [], log: [] }, x); };
    const t = empty({
      id: row.id,
      date: row.date,
      boatName: row.boatName,
      sites: row.sites,
      divemaster: row.divemaster,
      notes: row.notes,
      createdAt: row.createdAt,
      openForSignup: asBool(row.openForSignup),
      departTime: row.departTime || "",
      capacity: Number(row.capacity) || 0,
      priceNote: row.priceNote || "",
      publicNotes: row.publicNotes || "",
    });
    t.updatedAt = row.updatedAt;
    t.updatedBy = row.updatedBy;
    t.deleted = asBool(row.deleted);
    if (Array.isArray(row.log)) t.log = row.log;
    else if (typeof row.log === "string" && row.log) {
      try { t.log = JSON.parse(row.log); } catch (e) { t.log = t.log || []; }
    }
    t.divers = [];
    return t;
  }

  function dedupeRoster(rows) {
    const samePerson = C && C.samePerson ? C.samePerson.bind(C) : function (a, b) {
      return a && b && a.name && b.name && String(a.name).toLowerCase() === String(b.name).toLowerCase() && a.phone && a.phone === b.phone;
    };
    const byTrip = {};
    rows.forEach((r) => {
      if (asBool(r.deleted)) return;
      const k = r.tripId || "";
      if (!byTrip[k]) byTrip[k] = [];
      byTrip[k].push(r);
    });
    const drop = {};
    Object.keys(byTrip).forEach((tripId) => {
      const list = byTrip[tripId];
      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          const a = list[i], b = list[j];
          if (a.customerId && b.customerId && a.customerId === b.customerId || samePerson(a, b)) {
            const keep = newer(a, b) ? a : (newer(b, a) ? b : a);
            const lose = keep === a ? b : a;
            drop[lose.id] = true;
          }
        }
      }
    });
    return rows.map((r) => {
      if (drop[r.id]) return Object.assign({}, r, { deleted: true, updatedAt: nowISO() });
      return r;
    });
  }

  function applyRemote(state, payload) {
    const next = C && C.clone ? C.clone(state) : clone(state);
    const outbox = next.outbox || [];
    const byCol = {};
    COLLECTIONS.forEach((c) => { byCol[c] = outbox.filter((x) => x.collection === c); });

    const divers = mergeLists(flatten(next).divers, payload.divers, byCol.divers);
    const trips = mergeLists(flatten(next).trips, payload.trips, byCol.trips);
    let roster = mergeLists(flatten(next).roster, payload.roster, byCol.roster);
    roster = dedupeRoster(roster);
    const visits = mergeLists(flatten(next).visits, payload.visits, byCol.visits);
    const instructors = mergeLists(flatten(next).instructors, payload.instructors, byCol.instructors);
    const pending = mergeLists(next.pendingRegs || [], payload.pending, byCol.pending);
    const signups = mergeLists(next.signups || [], payload.signups, byCol.signups);

    next.customers = divers.filter((r) => !asBool(r.deleted)).map(rowToCustomer);
    const visitByCust = {};
    visits.filter((v) => !asBool(v.deleted)).forEach((v) => {
      const id = v.customerId;
      if (!visitByCust[id]) visitByCust[id] = [];
      visitByCust[id].push({
        id: v.id,
        tripId: v.tripId,
        date: (C && C.normalizeTripDate) ? C.normalizeTripDate(v.date) : v.date,
        boatName: v.boatName,
        sites: v.sites,
        attendance: v.attendance,
        checkedInAt: v.checkedInAt || null,
        activity: v.activity,
        instructor: v.instructor,
        course: v.course,
        payment: {
          status: v.payStatus || "unpaid",
          amount: Number(v.payAmount) || 0,
          collected: Number(v.payCollected) || 0,
          method: v.payMethod || "",
          note: v.payNote || "",
        },
      });
    });
    next.customers.forEach((c) => {
      const extra = visitByCust[c.id] || [];
      if (!extra.length) return;
      const have = {};
      (c.importedVisits || []).forEach((v) => { if (v && v.tripId) have[v.tripId] = true; });
      extra.forEach((v) => {
        if (v.tripId && have[v.tripId]) return;
        c.importedVisits = (c.importedVisits || []).concat([v]);
        if (v.tripId) have[v.tripId] = true;
      });
    });

    const tripMap = {};
    trips.filter((t) => !asBool(t.deleted)).forEach((t) => { tripMap[t.id] = rowToTrip(t); });
    roster.forEach((r) => {
      if (asBool(r.deleted)) return;
      const t = tripMap[r.tripId];
      if (!t) return;
      t.divers.push(rosterToDiver(r));
    });
    const localOrder = (next.trips || []).map((t) => t.id);
    const mergedTrips = [];
    const seen = {};
    localOrder.forEach((id) => { if (tripMap[id]) { mergedTrips.push(tripMap[id]); seen[id] = true; } });
    Object.keys(tripMap).forEach((id) => { if (!seen[id]) mergedTrips.push(tripMap[id]); });
    next.trips = mergedTrips;
    if (!next.currentTripId || !tripMap[next.currentTripId]) {
      next.currentTripId = (next.trips[0] && next.trips[0].id) || null;
    }

    const instNames = instructors.filter((r) => !asBool(r.deleted) && r.name).map((r) => r.name);
    const have = {};
    next.instructors = [];
    instNames.forEach((n) => {
      const k = String(n).trim().toLowerCase();
      if (!k || have[k]) return;
      have[k] = true;
      next.instructors.push(n);
    });
    next.instructors.sort((a, b) => String(a).localeCompare(String(b)));

    next.pendingRegs = pending || [];
    next.signups = (signups || []).filter((s) => !asBool(s.deleted)).map((s) => {
      return C && C.emptySignup ? C.emptySignup(s) : s;
    });
    importPending(next, payload.pending || pending);

    next.outbox = clearOutbox(outbox, {
      divers: divers, trips: trips, roster: roster, visits: visits, instructors: instructors, pending: pending, signups: signups,
    });
    if (payload.serverTime) next.settings.lastSyncAt = payload.serverTime;
    else next.settings.lastSyncAt = nowISO();
    return next;
  }

  function importPending(state, pending) {
    if (!C) return;
    (pending || []).forEach((p) => {
      if (!p || asBool(p.deleted) || asBool(p.accepted)) return;
      if ((state.pendingRegs || []).some((x) => x.id === p.id && asBool(x.accepted))) return;
      const rec = C.emptyCustomer(p);
      const up = C.upsertCustomer(state.customers, rec);
      state.customers = up.customers;
      if (p.tripId) {
        const trip = (state.trips || []).find((t) => t.id === p.tripId);
        if (trip && C.alreadyOnTrip && !C.alreadyOnTrip(up.customer, trip.divers).length) {
          const d = C.prepareReturningDiver
            ? C.prepareReturningDiver(up.customer, state.trips, { addedVia: "register" })
            : C.diverFromCustomer(up.customer, { addedVia: "register" });
          d.addedVia = "register";
          trip.divers.push(d);
        }
      }
      const accepted = stamp({
        id: p.id,
        tripId: p.tripId || "",
        name: p.name,
        phone: p.phone,
        address: p.address,
        accepted: true,
        deleted: false,
        updatedBy: crewNameOf(state),
      }, crewNameOf(state), true);
      state.pendingRegs = (state.pendingRegs || []).filter((x) => x.id !== p.id).concat([accepted]);
      state.outbox = state.outbox || [];
      state.outbox = state.outbox.filter((x) => !(x.collection === "pending" && x.record && x.record.id === p.id));
      state.outbox.push({ id: uid("ob"), collection: "pending", op: "upsert", record: accepted, queuedAt: accepted.updatedAt });
    });
  }

  function clearOutbox(outbox, remote) {
    return (outbox || []).filter((item) => {
      const list = remote[item.collection] || [];
      const rem = list.find((r) => r && r.id === (item.record && item.record.id));
      if (!rem) return true;
      if (newer(item.record, rem)) return true;
      return false;
    });
  }

  function buildRequest(state, action) {
    const settings = (state && state.settings) || {};
    const changes = { divers: [], trips: [], roster: [], visits: [], instructors: [], pending: [], signups: [] };
    if (!settings.lastSyncAt) {
      const flat = flatten(state);
      COLLECTIONS.forEach((c) => { changes[c] = flat[c] || []; });
    } else {
      (state.outbox || []).forEach((item) => {
        if (!item || !item.collection || !item.record) return;
        if (!changes[item.collection]) changes[item.collection] = [];
        changes[item.collection].push(item.record);
      });
    }
    return {
      action: action || "sync",
      key: settings.crewKey || "",
      crewName: settings.crewName || "",
      changes: changes,
    };
  }

  function buildRegisterRequest(diver, settings) {
    return {
      action: "register",
      key: (settings && settings.registerKey) || "",
      pending: {
        id: uid("p"),
        tripId: diver.tripId || "",
        name: diver.name,
        phone: diver.phone,
        address: diver.address,
        certLevel: diver.certLevel,
        certAgency: diver.certAgency,
        certNumber: diver.certNumber,
        emergencyName: diver.emergencyName,
        emergencyPhone: diver.emergencyPhone,
        notes: diver.notes,
        activity: diver.activity || "fun",
        instructor: diver.instructor || "",
        course: diver.course || "",
      },
    };
  }

  /* text/plain POST — simple request, no CORS preflight. */
  function postPlain(url, body, fetchImpl) {
    const fetchFn = fetchImpl || (typeof fetch === "function" ? fetch : null);
    if (!fetchFn) return Promise.reject(new Error("fetch is not available"));
    return fetchFn(String(url).trim(), {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: typeof body === "string" ? body : JSON.stringify(body),
      redirect: "follow",
    }).then((res) => {
      return res.text().then((text) => {
        let data;
        try { data = JSON.parse(text); } catch (e) {
          throw new Error("Sync server did not return JSON");
        }
        if (!res.ok && !data) throw new Error("Sync failed (" + res.status + ")");
        return data;
      });
    });
  }

  function pingGet(url, fetchImpl) {
    const fetchFn = fetchImpl || (typeof fetch === "function" ? fetch : null);
    const u = String(url).trim();
    const sep = u.indexOf("?") >= 0 ? "&" : "?";
    return fetchFn(u + sep + "action=ping", { method: "GET", redirect: "follow" }).then((res) => res.text().then((text) => JSON.parse(text)));
  }

  async function runSync(state, opts) {
    opts = opts || {};
    const settings = (state && state.settings) || {};
    if (!configured(settings) && !opts.force) {
      return { ok: true, skipped: true, reason: "not configured", state: state };
    }
    const req = buildRequest(state, opts.action || "sync");
    const data = opts.post
      ? await opts.post(req)
      : await postPlain(settings.syncUrl, req, opts.fetch);
    if (!data || data.ok === false) {
      return { ok: false, error: (data && data.error) || "Sync failed", state: state, response: data };
    }
    const next = applyRemote(state, data);
    return { ok: true, state: next, response: data };
  }

  async function runRegister(diver, settings, opts) {
    opts = opts || {};
    const url = (settings && settings.syncUrl) || "";
    if (!url) return { ok: false, skipped: true, reason: "not configured" };
    const req = buildRegisterRequest(diver, settings);
    const data = opts.post
      ? await opts.post(req)
      : await postPlain(url, req, opts.fetch);
    if (!data || data.ok === false) return { ok: false, error: (data && data.error) || "Register failed", response: data };
    return { ok: true, id: data.id, response: data };
  }

  function statusOf(state, extra) {
    extra = extra || {};
    if (!configured(state && state.settings)) {
      return { kind: "local", label: "Local only", pending: 0 };
    }
    if (extra.error) return { kind: "error", label: extra.error, pending: (state.outbox || []).length };
    if (extra.syncing) return { kind: "syncing", label: "Syncing…", pending: (state.outbox || []).length };
    const pending = (state.outbox || []).length;
    if (pending) return { kind: "pending", label: pending + " waiting to sync", pending: pending };
    const at = state.settings && state.settings.lastSyncAt;
    if (at && C && C.formatJST) return { kind: "synced", label: "Synced " + C.formatJST(at, true), pending: 0 };
    if (at) return { kind: "synced", label: "Synced", pending: 0 };
    return { kind: "ready", label: "Ready to sync", pending: 0 };
  }


  function publicConfigured(settings) {
    const s = settings || {};
    return !!(s.syncUrl && String(s.syncUrl).trim());
  }

  function openTripsStorage() {
    try {
      if (typeof localStorage !== "undefined" && localStorage) return localStorage;
    } catch (e) {}
    const g = typeof globalThis !== "undefined" ? globalThis : {};
    if (!g.__bcOpenTripsStore) g.__bcOpenTripsStore = {};
    const mem = g.__bcOpenTripsStore;
    return {
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
      setItem: function (k, v) { mem[k] = String(v); },
      removeItem: function (k) { delete mem[k]; },
    };
  }

  function openTripsCacheKey(settings) {
    const url = String((settings && settings.syncUrl) || "").replace(/\/+$/, "");
    return "boatcloak-open-trips:" + url;
  }

  function readCachedOpenTrips(settings) {
    try {
      const raw = openTripsStorage().getItem(openTripsCacheKey(settings));
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !Array.isArray(obj.trips)) return null;
      const trips = obj.trips
        .filter((t) => t && t.id && !(C && C.openTripHasPii && C.openTripHasPii(t)))
        .map((t) => normalizeTrip(Object.assign({}, t)));
      return { trips: trips, savedAt: obj.savedAt || 0 };
    } catch (e) {
      return null;
    }
  }

  function writeCachedOpenTrips(settings, trips) {
    try {
      const clean = (trips || [])
        .filter((t) => t && t.id && !(C && C.openTripHasPii && C.openTripHasPii(t)))
        .map((t) => normalizeTrip(Object.assign({}, t)));
      openTripsStorage().setItem(openTripsCacheKey(settings), JSON.stringify({ trips: clean, savedAt: Date.now() }));
      return clean;
    } catch (e) {
      return trips || [];
    }
  }

  function listOpenTrips(settings, opts) {
    opts = opts || {};
    const url = (settings && settings.syncUrl) || "";
    if (!url && !opts.post) return Promise.resolve({ ok: false, skipped: true, reason: "not configured", trips: [] });
    const req = { action: "opentrips", key: (settings && settings.registerKey) || "" };
    const go = opts.post ? opts.post(req) : postPlain(url, req, opts.fetch);
    return go.then((data) => {
      if (!data || data.ok === false) return { ok: false, error: (data && data.error) || "Could not load trips", trips: [] };
      const trips = Array.isArray(data.trips) ? data.trips : [];
      const clean = trips.filter((t) => t && t.id && !(C && C.openTripHasPii && C.openTripHasPii(t))).map((t) => normalizeTrip(Object.assign({}, t)));
      writeCachedOpenTrips(settings, clean);
      return { ok: true, trips: clean, response: data };
    });
  }

  function submitSignup(diver, tripId, settings, opts) {
    opts = opts || {};
    const url = (settings && settings.syncUrl) || "";
    if (!url && !opts.post) return Promise.resolve({ ok: false, skipped: true, reason: "not configured" });
    const check = C && C.validateSignupInput ? C.validateSignupInput(Object.assign({}, diver, { tripId: tripId })) : { ok: true };
    if (!check.ok) return Promise.resolve({ ok: false, error: check.error });
    const req = {
      action: "signup",
      key: (settings && settings.registerKey) || "",
      signup: {
        name: diver.name,
        phone: diver.phone,
        address: diver.address,
        certLevel: diver.certLevel,
        certAgency: diver.certAgency,
        certNumber: diver.certNumber,
        emergencyName: diver.emergencyName,
        emergencyPhone: diver.emergencyPhone,
        notes: diver.notes,
        activity: diver.activity || "fun",
        instructor: diver.instructor || "",
        course: diver.course || "",
        tripId: tripId,
      },
    };
    const go = opts.post ? opts.post(req) : postPlain(url, req, opts.fetch);
    return go.then((data) => {
      if (!data || data.ok === false) return { ok: false, error: (data && data.error) || "Could not send the request", response: data };
      const times = normalizePublicTimes({ tripDate: data.tripDate, departTime: data.departTime });
      return { ok: true, id: data.id, ref: data.ref, status: data.status, tripDate: times.tripDate, boatName: data.boatName, departTime: times.departTime, duplicate: !!data.duplicate, response: data };
    });
  }

  function checkSignupStatus(ref, settings, opts) {
    opts = opts || {};
    const url = (settings && settings.syncUrl) || "";
    if (!url && !opts.post) return Promise.resolve({ ok: false, skipped: true, reason: "not configured" });
    const req = { action: "signupstatus", key: (settings && settings.registerKey) || "", ref: ref };
    const go = opts.post ? opts.post(req) : postPlain(url, req, opts.fetch);
    return go.then((data) => {
      if (!data || data.ok === false) return { ok: false, error: (data && data.error) || "No request found for that code", response: data };
      const times = normalizePublicTimes({ tripDate: data.tripDate, departTime: data.departTime });
      return { ok: true, ref: data.ref, status: data.status, tripDate: times.tripDate, boatName: data.boatName, departTime: times.departTime };
    });
  }

  return {
    API_VERSION: API_VERSION,
    COLLECTIONS: COLLECTIONS,
    configured: configured,
    flatten: flatten,
    captureChanges: captureChanges,
    applyRemote: applyRemote,
    mergeLists: mergeLists,
    newer: newer,
    stamp: stamp,
    buildRequest: buildRequest,
    buildRegisterRequest: buildRegisterRequest,
    postPlain: postPlain,
    pingGet: pingGet,
    runSync: runSync,
    runRegister: runRegister,
    listOpenTrips: listOpenTrips,
    readCachedOpenTrips: readCachedOpenTrips,
    writeCachedOpenTrips: writeCachedOpenTrips,
    openTripsCacheKey: openTripsCacheKey,
    submitSignup: submitSignup,
    checkSignupStatus: checkSignupStatus,
    publicConfigured: publicConfigured,
    statusOf: statusOf,
    clearOutbox: clearOutbox,
    instructorId: instructorId,
  };
});

</script>
<script>
/* BoatCloak v1.4.4 — crew + self-registration PWA (offline-first, optional shared sync) */
(function () {
  "use strict";
  const C = window.BCCore;
  const APP_VERSION = "1.4.4";
  const IDB_NAME = "boatcloak";
  const IDB_NAME_LEGACY = "boatcheck";
  const IDB_STORE = "kv";
  const STATE_KEY = "state";
  const LS_KEY = "boatcloak-state";
  const LS_KEY_LEGACY = "boatcheck-state";
  const DRAFT_KEY = "boatcloak-register-draft";
  const DRAFT_KEY_LEGACY = "boatcheck-register-draft";
  const S = window.BCSync;

  const $ = (sel, el) => (el || document).querySelector(sel);
  const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    }[c]));
  }

  function telLink(phone, label) {
    const href = C.telHref(phone);
    const text = label || (C.formatPhone && C.formatPhone(phone)) || phone || "";
    if (!href) return esc(text);
    return '<a class="tel" href="' + esc(href) + '">' + esc(text) + "</a>";
  }

  function contactBlock(d) {
    const phone = d.phone
      ? telLink(d.phone)
      : '<span class="missing">—</span>';
    const address = d.address
      ? '<span class="address">' + esc(d.address) + "</span>"
      : '<span class="missing">—</span>';
    let ice;
    if (d.emergencyName || d.emergencyPhone) {
      ice = esc(d.emergencyName || "Emergency");
      if (d.emergencyPhone) ice += " · " + telLink(d.emergencyPhone);
    } else {
      ice = '<span class="missing">—</span>';
    }
    return (
      '<div class="contact">' +
      '<div class="contact-row"><span class="k">Phone</span><span class="v">' + phone + "</span></div>" +
      '<div class="contact-row"><span class="k">Address</span><span class="v">' + address + "</span></div>" +
      '<div class="contact-row"><span class="k">Emergency</span><span class="v">' + ice + "</span></div>" +
      "</div>"
    );
  }

  function textareaField(label, id, value, hint, opts) {
    const req = !!(opts && opts.required);
    return (
      '<div class="field"><label for="' + id + '">' + esc(label) +
      '</label><textarea id="' + id + '" rows="3"' +
      (req ? ' required aria-required="true"' : ' placeholder="Optional"') + ">" +
      esc(value || "") + "</textarea>" +
      (hint ? '<div class="hint">' + esc(hint) + "</div>" : "") +
      "</div>"
    );
  }

  function requirePersonOrToast(rec, addressId) {
    const v = C.validatePersonInput(rec);
    const el = addressId && document.getElementById(addressId);
    if (el) {
      if (!String((rec && rec.address) || "").trim()) el.setAttribute("aria-invalid", "true");
      else el.removeAttribute("aria-invalid");
    }
    if (!v.ok) { toast(v.error, true); return false; }
    return true;
  }

  function toast(msg, err) {
    const el = $("#toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle("err", !!err);

  function downloadText(filename, text, mime) {
    const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 500);
  }

  function downloadUrl(filename, url) {

  function tripFileSlug(trip) {
    const d = (trip && trip.date) || C.todayJST();
    const b = ((trip && trip.boatName) || "trip")
      .replace(/[^a-zA-Z0-9]+/g, "-")
      .replace(/^-|-$/g, "")
      .slice(0, 40);
    return d + "-" + (b || "trip");
  }

  function openIdb(name) {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error("no idb"));
      const req = indexedDB.open(name || IDB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function idbGet(key) {
    return openIdb(IDB_NAME).then(
      (db) =>
        new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, "readonly");
          const r = tx.objectStore(IDB_STORE).get(key);
          r.onsuccess = () => resolve(r.result);
          r.onerror = () => reject(r.error);
        })
    );
  }

  function idbSet(key, val) {
    return openIdb(IDB_NAME).then(
      (db) =>
        new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, "readwrite");
          tx.objectStore(IDB_STORE).put(val, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        })
    );
  }

  async function readIdbIfExists(name) {
    try {
      if (indexedDB.databases) {
        const list = await indexedDB.databases();
        if (!(list || []).some((d) => d.name === name)) return null;
      }
      return await openIdb(name).then(
        (db) =>
          new Promise((resolve, reject) => {
            if (!db.objectStoreNames.contains(IDB_STORE)) { resolve(null); return; }
            const tx = db.transaction(IDB_STORE, "readonly");
            const r = tx.objectStore(IDB_STORE).get(STATE_KEY);
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => reject(r.error);
          })
      );
    } catch (e) {
      return null;
    }
  }

  let lastMigration = { migrated: false, from: null };

  async function loadState() {
    let currentIdb = null, legacyIdb = null, currentLs = null, legacyLs = null;
    try { currentIdb = await readIdbIfExists(IDB_NAME); } catch (e) {}
    try { legacyIdb = await readIdbIfExists(IDB_NAME_LEGACY); } catch (e) {}
    try { currentLs = localStorage.getItem(LS_KEY); } catch (e) {}
    try { legacyLs = localStorage.getItem(LS_KEY_LEGACY); } catch (e) {}
    const resolved = C.resolveStoredState({
      currentIdb: currentIdb,
      currentLs: currentLs,
      legacyIdb: legacyIdb,
      legacyLs: legacyLs,
    });
    lastMigration = { migrated: !!resolved.migrated, from: resolved.from || null };
    return resolved.state || C.emptyState();
  }

  async function persistState(state) {
    const payload = C.clone(state);
    try {
      await idbSet(STATE_KEY, payload);
    } catch (e) {}
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(payload));
    } catch (e) {}
  }

  function makeQr(text) {
    if (typeof qrcode !== "function") throw new Error("QR library missing");
    const qr = qrcode(0, "M");
    qr.addData(text, "Byte");
    qr.make();
    return qr;
  }

  function drawQrOnCanvas(canvas, text, cssSize) {
    const qr = makeQr(text);
    const count = qr.getModuleCount();
    const margin = 2;
    const scale = Math.max(2, Math.floor((cssSize || 320) / (count + margin * 2)));
    const size = (count + margin * 2) * scale;
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#000000";
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) ctx.fillRect((c + margin) * scale, (r + margin) * scale, scale, scale);
      }
    }
    return canvas;
  }

    const left = C.seatsLeft(trip);

          "</div>";

          (s.activity === "class" ? " · Class" + (s.instructor ? " · " + esc(s.instructor) : "") + (s.course ? " · " + esc(s.course) : "") : " · Fun diving") +
          "</div>";

    const left = trip ? C.seatsLeft(trip) : null;
    const body =
      '<p style="margin-top:0"><strong>' + esc(s.name) + "</strong>" + trustedBadge(s) +

      (trip ? '<p>' + esc(trip.date) + " · " + esc(trip.boatName || "") + (trip.departTime ? " · " + esc(trip.departTime) : "") +

        "</p>" : '<p class="muted">Trip not found on this phone yet. Sync and try again.</p>') +
      (s.status === "pending" ? '<div class="wrap">' +

        '<button class="btn" data-act="req-decide" data-id="' + esc(s.id) + '" data-decision="waitlist">Waitlist</button>' +
        '<button class="btn danger" data-act="req-decide" data-id="' + esc(s.id) + '" data-decision="declined">Decline</button></div>' : "");
    openSheet("Request · " + (s.name || s.ref), body);

  function decideSignup(id, decision, overbook) {
    const res = C.applySignupDecision(state, id, decision, {
      crewName: (state.settings && state.settings.crewName) || "",
      overbook: !!overbook,
    });
    if (res.needOverbook) {
      if (confirm(res.error || "This trip is full. Approve anyway as an overbook?")) return decideSignup(id, decision, true);
      return;
    }
    if (!res.ok) { toast(res.error || "Could not update that request", true); return; }
    state = res.state;
    if (S) prevFlat = S.captureChanges(state, prevFlat);
    scheduleSave();
    closeModal();
    render();
    const label = C.SIGNUP_LABEL[decision] || decision;
    toast((res.returning ? "Return diver approved" : label + " " + (res.signup && res.signup.name || "")) + (res.overbooked ? " (overbook)" : ""));
  }

        selectField("Agency", "r-ca", C.AGENCIES, draft.certAgency) +
        "</div>" +
        field("Cert number", "r-cn", draft.certNumber) +
        textareaField("Notes (optional)", "r-nt", draft.notes) +
        (regUi.config
          ? '<div class="reg-actions"><button type="submit" class="btn primary block" id="reg-continue">Continue to trip list</button></div>'
          : (waiting
            ? '<div class="reg-actions"><button type="submit" class="btn primary block" id="reg-continue" disabled>Checking…</button></div>'
            : '<div class="reg-actions"><button type="submit" class="btn primary block" id="reg-continue" disabled>Online sign-up is not set up</button></div>')) +
        "</form>";
    }

    body += '<div class="card" style="margin-top:24px"><h2>Check a request</h2>' +
      '<p class="muted" style="margin-top:0">Enter the reference code from your confirmation screen.</p>' +
      field("Reference code", "reg-status-ref", (regUi.status && regUi.status.ref) || "", "text") +
      '<button type="button" class="btn" data-act="reg-check-status">Check status</button>' +
      '<p id="reg-status-out" class="muted" style="margin-top:10px">' +
      (regUi.status && regUi.status.label ? esc(regUi.status.label) : "") + "</p></div>";
    body += '</div>';
    root.innerHTML = body;
    try { root.scrollTop = 0; window.scrollTo(0, 0); } catch (e) {}

    if (step === "form") {
      document.querySelectorAll("input[name=\"r-ay\"]").forEach((el) => {
        el.addEventListener("change", () => {
          const box = document.getElementById("r-class-fields");
          const checked = document.querySelector("input[name=\"r-ay\"]:checked");
          if (box) box.hidden = !(checked && checked.value === "class");
        });
      });
      bindCertStudentFields("r");
      if (regUi.config === undefined) probePublicSignup();
    }
  }

  async function probePublicSignup() {
    const cfg = await loadPublicSyncConfig();
    if (!isRegisterMode()) return;
    if (regUi.step !== "form") return;
    regUi.config = cfg;
    const note = $("#reg-online-note");
    const btn = $("#reg-continue");
    if (!cfg) {
      if (note) note.innerHTML = "Online sign-up is not set up. Ask the crew how to register, or try this link again after the shop has connected the site.";
      if (note) note.className = "offline-signup-note";
      if (btn) {
        btn.textContent = "Online sign-up is not set up";
        btn.disabled = true;
      }
      return;
    }
    if (note) {
      note.className = "muted";
      note.textContent = "After you fill this in, you can request a spot on an open trip. The crew gets that request on their phones.";
    }
    if (btn) {
      btn.disabled = false;
      btn.textContent = "Continue to trip list";
    }
  }

  function applyRegisterTripList(trips, wanted, opts) {
    opts = opts || {};
    regUi.trips = trips || [];
    regUi.tripsUpdating = !!opts.updating;
    const deep = C.resolveRegisterTrip(regUi.trips, wanted);
    regUi.deepLink = deep;
    if (wanted) regUi.selectedTripId = deep.selectedId || "";
    else if (!(regUi.selectedTripId && (regUi.trips || []).some((t) => t.id === regUi.selectedTripId))) {
      regUi.selectedTripId = deep.selectedId || "";
    }
    regUi.step = "trips";
  }

  async function afterRegForm(rec) {
    if (!requirePersonOrToast(rec, "r-ad")) return;
    saveDraft(rec);
    const cfg = regUi.config === undefined ? await loadPublicSyncConfig() : regUi.config;
    regUi.config = cfg;
    if (!cfg || !S) {
      regUi.diver = rec;
      regUi.step = "form";
      renderRegister();
      toast("Online sign-up is not set up on this site", true);
      return;
    }
    const wanted = requestedTripId();
    regUi.wantedTripId = wanted;
    regUi.diver = rec;
    const cached = S.readCachedOpenTrips ? S.readCachedOpenTrips(cfg) : null;
    const cachedTrips = cached && cached.trips && cached.trips.length ? cached.trips : null;
    if (cachedTrips) {
      applyRegisterTripList(cachedTrips, wanted, { updating: true });
      renderRegister();
    } else {
      toast("Loading open trips…");
    }
    try {
      const listed = await S.listOpenTrips(cfg);
      const trips = (listed && listed.ok && listed.trips) || [];
      applyRegisterTripList(trips, wanted, { updating: false });
      const t = document.getElementById("toast");
      if (t) t.classList.remove("show");
      renderRegister();
    } catch (err) {
      if (cachedTrips) {
        applyRegisterTripList(cachedTrips, wanted, { updating: false });
        renderRegister();
        toast(err && err.message ? err.message : "Could not refresh trips", true);
        return;
      }
      toast(err && err.message ? err.message : "Could not load trips", true);
      regUi.diver = rec;
      regUi.step = "form";
      renderRegister();
    }
  }

  async function sendSignupRequest() {
    if (regUi.sending) return;
    const rec = regUi.diver || readRegForm();
    const tripId = regUi.selectedTripId;
    const noteEl = $("#r-req-note");
    if (noteEl) rec.notes = noteEl.value;
    if (!tripId) { toast("Choose a trip", true); return; }
    const v = C.validateSignupInput(Object.assign({}, rec, { tripId: tripId }));
    if (!v.ok) { toast(v.error, true); return; }
    regUi.sending = true;
    renderRegister();
    try {
      const res = await S.submitSignup(rec, tripId, regUi.config);
      if (!res.ok) {
        regUi.sending = false;
        renderRegister();
        toast(res.error || "Could not send the request", true);
        return;
      }
      regUi.diver = rec;
      regUi.result = res;
      regUi.step = "done";
      regUi.sending = false;
      renderRegister();
      toast(res.duplicate ? ("You already have a request for this trip, ref " + (res.ref || "")) : "Request sent");
    } catch (err) {
      regUi.sending = false;
      renderRegister();
      toast(err && err.message ? err.message : "Could not send the request", true);
    }
  }

  async function checkRegStatus() {
    const ref = val("reg-status-ref");
    if (!ref) { toast("Enter your reference code", true); return; }
    const cfg = regUi.config || await loadPublicSyncConfig();
    if (!cfg || !S) { toast("Online sign-up is not set up on this site", true); return; }
    try {
      const res = await S.checkSignupStatus(ref, cfg);
      const out = $("#reg-status-out");
      if (!res.ok) {
        if (out) out.textContent = res.error || "No request found for that code";
        toast(res.error || "No request found for that code", true);
        return;
      }
      const label = (C.SIGNUP_LABEL[res.status] || res.status) +
        (res.tripDate || res.boatName ? " · " + (res.tripDate || "") + (res.departTime ? " · " + res.departTime : "") + (res.boatName ? " · " + res.boatName : "") : "");
      regUi.status = { ref: res.ref, label: label, status: res.status };
      if (out) out.textContent = label;
    } catch (err) {
      toast(err && err.message ? err.message : "Could not check that code", true);
    }
  }

  function loadDraft() {
    try {
      const raw = localStorage.getItem(DRAFT_KEY) || localStorage.getItem(DRAFT_KEY_LEGACY) || "{}";
      return JSON.parse(raw) || {};
    } catch (e) { return {}; }

  function publicBaseUrl() {
    const saved = (state.settings.hostedUrl || "").trim();
    if (saved) return saved.replace(/\/+$/, "");
    if (location.protocol === "http:" || location.protocol === "https:") {
      const clean = location.pathname.replace(/index\.html?$/i, "");
      return location.origin + clean;
    }
    return "";
  }

  function registerUrl(tripId) {
    return C.registerUrlFor(publicBaseUrl(), tripId);
  }

  function posterTrip() {
    const id = ui.posterTripId;
    if (!id) return null;
    return (state.trips || []).find((t) => t.id === id) || null;

  function openSheet(title, bodyHtml, footerHtml) {
    closeModal();
    const o = document.createElement("div");
    o.className = "overlay";
    o.id = "overlay";
    o.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) +

      '</h2><button class="icon-btn" data-act="close-modal" aria-label="Close">✕</button></div>' +
      bodyHtml + (footerHtml || "") + "</div>";

    const p = idPrefix || "d";

    return (
      field("Full name *", p + "-name", d.name) +
      field("Phone", p + "-phone", d.phone, "tel") +

      field("Emergency contact name", p + "-en", d.emergencyName) +
      field("Emergency contact phone", p + "-ep", d.emergencyPhone, "tel") +

  function activityFormFields(d, p) {
    const a = C.normalizeActivity(d);
    const instructors = (state.instructors || []).slice();
    if (a.instructor && instructors.indexOf(a.instructor) < 0) instructors.push(a.instructor);
    let html = '<div class="field" id="' + p + '-ay-wrap"><span class="k-label">Activity this trip</span><div class="seg" role="radiogroup" aria-label="Activity">';
    html += '<label class="seg-opt"><input type="radio" name="' + p + '-ay" id="' + p + '-ay-fun" value="fun"' +
      (a.activity !== "class" ? " checked" : "") + '> Fun diving</label>';
    html += '<label class="seg-opt"><input type="radio" name="' + p + '-ay" id="' + p + '-ay-class" value="class"' +
      (a.activity === "class" ? " checked" : "") + '> Class</label>';
    html += "</div></div>";
    html += '<div class="class-only" id="' + p + '-class-fields"' + (a.activity === "class" ? "" : " hidden") + ">";
    html += '<div class="field"><label for="' + p + '-ir">Instructor</label><select id="' + p + '-ir">';
    html += '<option value="">Select instructor</option>';
    instructors.forEach((n) => {
      html += '<option value="' + esc(n) + '"' + (a.instructor === n ? " selected" : "") + ">" + esc(n) + "</option>";

    html += '<datalist id="' + p + '-co-list">' + C.COURSE_SUGGESTIONS.map((c) => "<option value=\"" + esc(c) + "\"></option>").join("") + "</datalist>";
    html += '<div class="hint">Suggestions are a starting point — you can type any course name.</div></div></div>';
    return html;
  }

  function trustedFormFields(d, p) {
    const on = C.isTrustedPerson(d, state.customers);
    const note = C.trustedNoteFor(d, state.customers);
    return (
      '<label class="trusted-toggle" style="display:flex;align-items:center;gap:10px;min-height:48px;margin:8px 0">' +
      '<input type="checkbox" id="' + p + '-trusted"' + (on ? " checked" : "") + "> Trusted diver</label>" +
      '<div class="field"><label for="' + p + '-trusted-note">Trusted note (crew only, optional)</label>' +
      '<input id="' + p + '-trusted-note" maxlength="200" placeholder="e.g. Deep cert, 200+ dives" value="' + esc(note) + '">' +
      '<div class="hint">Only visible to crew. Not shown on the public sign-up page or posters.</div></div>'
    );

  function syncCertStudentFields(prefix) {
    const p = prefix || "d";
    const rec = {
      certLevel: val(p + "-cl"),
      course: val(p + "-co"),
      activity: ((document.querySelector('input[name="' + p + '-ay"]:checked') || {}).value) || "",
    };
    const student = C.isOpenWaterStudent(rec);
    const ca = document.getElementById(p + "-ca");
    const cn = document.getElementById(p + "-cn");
    const caWrap = ca && (ca.closest(".field") || ca.parentElement);
    const cnWrap = cn && (cn.closest(".field") || cn.parentElement);
    if (caWrap) caWrap.hidden = !!student;
    if (cnWrap) cnWrap.hidden = !!student;
    let note = document.getElementById(p + "-ow-note");
    const cl = document.getElementById(p + "-cl");
    if (!note && cl) {
      note = document.createElement("div");
      note.id = p + "-ow-note";
      note.className = "hint ow-student-note";
      note.textContent = "Not required for Open Water students.";
      const host = cl.closest(".field") || cl.parentElement;
      if (host && host.parentElement) host.parentElement.insertBefore(note, host.nextSibling);
      else if (host) host.appendChild(note);
    }
    if (note) note.hidden = !student;
  }

  function bindCertStudentFields(prefix) {
    const p = prefix || "d";
    const sync = () => syncCertStudentFields(p);
    ["cl", "co"].forEach((suf) => {
      const el = document.getElementById(p + "-" + suf);
      if (el) {
        el.addEventListener("input", sync);
        el.addEventListener("change", sync);
      }
    });
    document.querySelectorAll('input[name="' + p + '-ay"]').forEach((el) => el.addEventListener("change", sync));
    sync();
  }

  function bindActivityForm(prefix) {
    const p = prefix || "d";
    const sync = () => {
      const classOn = document.querySelector("input[name=\"" + p + "-ay\"]:checked");
      const fields = document.getElementById(p + "-class-fields");
      if (fields) fields.hidden = !(classOn && classOn.value === "class");
    };
    document.querySelectorAll("input[name=\"" + p + "-ay\"]").forEach((el) => el.addEventListener("change", sync));
    const sel = document.getElementById(p + "-ir");
    if (sel) {
      sel.addEventListener("change", () => {
        if (sel.value !== "__new__") return;
        const name = (prompt("New instructor name") || "").trim();
        if (!name) { sel.value = ""; return; }
        state.instructors = C.upsertInstructor(state.instructors, name);
        scheduleSave();
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        sel.insertBefore(opt, sel.lastElementChild);
        sel.value = name;
      });
    }
    sync();
    bindCertStudentFields(p);
  }

  function readPersonForm(prefix) {
    const p = prefix || "d";
    const ad = document.getElementById(p + "-ad");
    const nt = document.getElementById(p + "-nt");
    const rec = {
      name: val(p + "-name"),
      phone: C.formatPhone ? C.formatPhone(val(p + "-phone")) : val(p + "-phone"),
      address: ad ? ad.value.trim() : "",
      emergencyName: val(p + "-en"),
      emergencyPhone: C.formatPhone ? C.formatPhone(val(p + "-ep")) : val(p + "-ep"),
      certLevel: val(p + "-cl"),
      certAgency: val(p + "-ca"),
      certNumber: val(p + "-cn"),
      notes: nt ? nt.value : "",
    };
    const tr = document.getElementById(p + "-trusted");
    if (tr) {
      rec.trusted = !!tr.checked;
      rec.trustedNote = val(p + "-trusted-note");
    }
    if (document.getElementById(p + "-ay-fun") || document.getElementById(p + "-ir")) {
      const checked = document.querySelector('input[name="' + p + '-ay"]:checked');
      rec.activity = (checked && checked.value) || "fun";
      rec.instructor = val(p + "-ir") === "__new__" ? "" : val(p + "-ir");
      rec.course = val(p + "-co");
    }
    return rec;
  }

  function openDiverEditor(existing) {
    const t = trip();
    if (!t) {
      toast("Open a trip first", true);
      ui.tab = "trips";
      render();
      return;
    }
    const d = existing ? C.clone(existing) : C.emptyDiver();

  function saveSyncSettings(opts) {
    opts = opts || {};
    const urlEl = $("#set-sync-url");
    const keyEl = $("#set-crew-key");
    const nameEl = $("#set-crew-name");
    const url = (urlEl ? val("set-sync-url") : state.settings.syncUrl || "").trim();
    const key = (keyEl && val("set-crew-key") != null ? val("set-crew-key") : state.settings.crewKey) || "";
    const name = (nameEl && val("set-crew-name") != null ? val("set-crew-name") : state.settings.crewName) || "";
    state.settings.syncUrl = url;
    state.settings.crewKey = String(key).trim();
    state.settings.crewName = String(name).trim();
    scheduleSave();
    updateSyncChip();
    if (!opts.quiet) {
      toast(url && state.settings.crewKey ? "Shared sync saved" : "Shared sync cleared — this phone is local-only");
    }
  }

  async function applySiteConfigIfNeeded() {
    const cfg = await loadPublicSyncConfig();
    siteSyncConfig = cfg;
    const res = C.applySiteSyncUrl(state.settings, cfg);
    state.settings = res.settings;
    if (res.changed) await persistState(state);
    return res;
  }

  async function beginCrewSync() {
    saveSyncSettings({ quiet: true });
    if (C.isPublicRegisterKey(state.settings.crewKey, siteSyncConfig)) {
      state.settings.crewKey = "";
      scheduleSave();
      updateSyncChip();
      toast("That is the public register key. Enter the crew key instead.", true);
      const keyEl = $("#set-crew-key");
      if (keyEl) keyEl.value = "";
      return { ok: false, error: "register key is not the crew key" };
    }
    if (!S || !S.configured(state.settings)) return { ok: false, skipped: true };
    try {
      const data = await S.postPlain(state.settings.syncUrl, { action: "ping" });
      if (!data || !data.ok) {
        const err = (data && data.error) || "Could not reach the web app";
        lastSyncError = err;
        updateSyncChip();
        toast(err, true);
        return { ok: false, error: err };
      }
    } catch (err) {
      lastSyncError = err && err.message ? err.message : String(err);
      updateSyncChip();
      toast(lastSyncError, true);
      return { ok: false, error: lastSyncError };
    }
    await runSyncNow("open");
    return { ok: true };
  }

  function updateSyncChip() {
    const el = $("#sync-chip");
    if (!el) return;
    const st = S ? S.statusOf(state, { syncing: syncing, error: lastSyncError }) : { kind: "local", label: "Local only" };
    el.hidden = false;
    el.className = "sync-chip " + st.kind;
    el.textContent = st.kind === "local" ? "Local" : st.kind === "syncing" ? "Sync" : st.kind === "pending" ? String(st.pending) : st.kind === "error" ? "!" : "✓";
    el.title = st.label;
    el.setAttribute("aria-label", st.label);
    const more = $("#sync-status-more");
    if (more) {
      more.className = "sync-status " + st.kind;
      more.textContent = st.label;
    }
  }

  function maybeSync(reason) {
    if (!S || !S.configured(state.settings)) return;
    if (reason === "manual" || reason === "open" || reason === "online" || reason === "visible") {
      return runSyncNow(reason);
    }
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => runSyncNow("change"), 800);
  }

  async function runSyncNow(reason) {
    if (!S) return;
    if (syncing) return;
    if (!S.configured(state.settings)) {
      if (reason === "manual") toast("Add the web app URL and crew key under Shared sync", true);
      return;
    }
    if (typeof navigator !== "undefined" && navigator.onLine === false && reason !== "manual") return;
    syncing = true;
    lastSyncError = "";
    updateSyncChip();
    try {
      const res = await S.runSync(state);
      if (res.ok && res.state && !res.skipped) {
        state = res.state;
        prevFlat = S.flatten(state);
        await persistState(state);
        render();
      } else if (!res.ok && !res.skipped) {
        lastSyncError = res.error || "Sync failed";
        if (reason === "manual") toast(lastSyncError, true);
      } else if (res.ok && reason === "manual") {
        toast("Already up to date");
      }
    } catch (err) {
      lastSyncError = err && err.message ? err.message : String(err);
      if (reason === "manual") toast(lastSyncError, true);
    }
    syncing = false;
    updateSyncChip();
  }

  async function testSyncConnection() {
    saveSyncSettings();
    if (!S || !S.configured(state.settings)) {
      toast("Add the web app URL and crew key first", true);
      return;
    }
    try {
      const data = await S.postPlain(state.settings.syncUrl, { action: "ping" });
      if (data && data.ok) toast("Connection ok" + (data.app ? " (" + data.app + ")" : ""));
      else toast((data && data.error) || "No response", true);
    } catch (err) {
      toast(err && err.message ? err.message : String(err), true);
    }
  }

  async function loadPublicSyncConfig() {
    try {
      const r = await fetch("./sync-config.json", { cache: "no-store" });
      if (!r.ok) return null;
      const j = await r.json();
      if (!j || !j.syncUrl) return null;
      return { syncUrl: j.syncUrl, registerKey: j.registerKey || "" };
    } catch (e) {
      return null;
    }
  }

  function setAttendance(diverId, newAtt) {
    const t = trip();
    if (!t) return;
    const d = t.divers.find((x) => x.id === diverId);
    if (!d) return;
    const res = C.applyAttendance(d, newAtt);
    if (!res.changed) return;
    const i = t.divers.findIndex((x) => x.id === diverId);
    t.divers[i] = res.diver;
    if (res.event) addLog(res.event);
    beep(newAtt === "showed_up" ? 880 : newAtt === "no_show" ? 330 : 440);
    scheduleSave();
    render();

  function addDiverToTrip(diver, opts) {
    const t = trip();
    if (!t) {
      toast("Open a trip first", true);
      return { ok: false, error: "No trip" };
    }
    opts = opts || {};
    const dups = C.findDuplicates(diver, t.divers);
    rememberInstructor(diver);
    if (dups.length && diver.addedVia === "qr" && !opts.allowDup && !opts.replace) {
      const target = dups[0];
      ["name", "phone", "address", "certLevel", "certAgency", "certNumber", "emergencyName", "emergencyPhone", "notes", "activity", "instructor", "course"].forEach((k) => {
        if (diver[k]) target[k] = diver[k];
      });
      const up = C.upsertCustomer(state.customers, target);
      state.customers = up.customers;
      target.customerId = up.customer.id;
      const res = C.applyAttendance(target, "showed_up");
      const i = t.divers.findIndex((x) => x.id === target.id);
      if (i >= 0) t.divers[i] = res.diver;
      if (res.changed && res.event) addLog(res.event);
      else addLog(C.logEntry("checkin", target.name + " already checked in"));
      beep(880);
      scheduleSave();
      closeModal();
      render();
      toast(res.changed ? res.diver.name + " showed up" : target.name + " already checked in");
      return { ok: true, checkedIn: true, alreadyOnTrip: true, updatedRecord: true, diver: res.diver || target };
    }
    if (dups.length && !opts.allowDup && !opts.replace) {
      return promptDuplicate(diver, dups);
    }
    if (dups.length && opts.replace) {
      const target = dups[0];
      const keep = { id: target.id, attendance: target.attendance, checkedInAt: target.checkedInAt, payment: target.payment, addedAt: target.addedAt };
      Object.assign(target, diver, keep);
      const up = C.upsertCustomer(state.customers, target);
      state.customers = up.customers;
      target.customerId = up.customer.id;
      addLog(C.logEntry("info", target.name + " updated from QR"));
      scheduleSave();
      closeModal();
      render();
      toast("Updated " + target.name);
      return { ok: true, updated: true, diver: target };
    }
    const up = C.upsertCustomer(state.customers, diver);
    state.customers = up.customers;
    diver.customerId = up.customer.id;
    diver.id = diver.id || C.uid("d");
    diver.addedAt = diver.addedAt || C.nowISO();
    let checkinEvent = null;
    if (diver.addedVia === "qr" || opts.checkIn) {
      const marked = C.applyAttendance(diver, "showed_up");
      diver = marked.diver;
      checkinEvent = marked.event;
    }
    t.divers.push(diver);
    const via = diver.addedVia === "qr" ? " by QR" : diver.addedVia === "return" ? " (returning)" : "";
    addLog(C.logEntry("add", diver.name + " added" + via));
    if (checkinEvent) addLog(checkinEvent);
    scheduleSave();
    if (!opts.silent) {
      closeModal();
      render();
      toast((diver.addedVia === "qr" || opts.checkIn) && diver.attendance === "showed_up" ? diver.name + " showed up" : "Added " + diver.name);
    }
    return { ok: true, diver: diver, checkedIn: !!(checkinEvent || diver.attendance === "showed_up" && opts.checkIn) };
  }

  function promptDuplicate(diver, dups) {
    const names = dups.map((d) => d.name).join(", ");
    const body =
      '<div class="dup-warn">This looks like someone already on the trip: ' + esc(names) + "</div>" +
      "<p>Add them again anyway, or update the existing roster entry with the scanned details.</p>" +
      '<div class="wrap">' +
      '<button class="btn primary" id="dup-update">Update existing</button>' +
      '<button class="btn" id="dup-add">Add anyway</button>' +
      '<button class="btn" data-act="close-modal">Cancel</button></div>';
    openSheet("Possible duplicate", body);
    $("#dup-update").onclick = () => addDiverToTrip(diver, { replace: true });
    $("#dup-add").onclick = () => addDiverToTrip(diver, { allowDup: true });
    return { ok: false, duplicate: true, matches: dups };
  }

  function beep(freq) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = freq || 880;
      g.gain.value = 0.04;
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.08);
    } catch (e) {}
  }

  function onClick(e) {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    const id = btn.dataset.id;
    if (act === "close-modal") { closeModal(); return; }
    if (act === "show-trips-tab") { ui.tab = "trips"; render(); return; }
    if (act === "attendance") { setAttendance(id, btn.dataset.attendance); return; }
    if (act === "attend-filter") { ui.attendFilter = btn.dataset.filter || "all"; render(); return; }
    if (act === "activity-filter") { ui.activityFilter = btn.dataset.filter || "all"; render(); return; }
    if (act === "add-diver") { openDiverEditor(); return; }
    if (act === "edit-diver") {
      const d = trip() && trip().divers.find((x) => x.id === id);
      if (d) openDiverEditor(d);
      return;
    }
    if (act === "diver-detail") {
      const d = trip() && trip().divers.find((x) => x.id === id);
      if (d) openPersonDetail(d, "diver");
      return;
    }
    if (act === "customer-detail") {
      const c = state.customers.find((x) => x.id === id);
      if (c) openPersonDetail(c, "customer");
      return;
    }
    if (act === "remove-diver") {
      const t = trip();
      if (!t) return;
      const d = t.divers.find((x) => x.id === id);
      if (!d) return;
      if (!confirm("Remove " + d.name + " from this trip? The customer record is kept.")) return;
      t.divers = t.divers.filter((x) => x.id !== id);
      addLog(C.logEntry("info", d.name + " removed from trip"));
      scheduleSave();
      closeModal();
      render();
      return;
    }
    if (act === "new-trip") { openTripEditor(); return; }
    if (act === "edit-current-trip") {
      if (trip()) openTripEditor(trip());
      return;
    }
    if (act === "edit-trip") {
      const t = id ? (state.trips || []).find((x) => x.id === id && !x.deleted) : trip();
      if (t) openTripEditor(t);
      return;
    }
    if (act === "open-trip") {
      state.currentTripId = id;
      ui.tab = "roster";
      scheduleSave();
      closeModal();
      render();
      return;
    }
    if (act === "delete-trip") {
      const t = (id && (state.trips || []).find((x) => x.id === id)) || trip();
      if (!t || t.deleted) return;
      if (!confirm("Delete this trip? The roster for this trip is removed from the live list. Customer records and sign-up requests stay, and the trip id is kept so posters do not change. This cannot be undone.")) return;
      const res = C.tombstoneTrip(state.trips, t.id);
      if (!res.ok) { toast(res.error || "Could not delete this trip", true); return; }
      state.trips = res.trips;
      if (state.currentTripId === t.id) {
        const next = C.liveTrips(state.trips)[0];
        state.currentTripId = next ? next.id : null;
      }
      scheduleSave();
      closeModal();
      ui.tab = "trips";
      render();
      toast("Trip deleted");
      return;
    }
    if (act === "req-filter") { ui.reqFilter = btn.dataset.filter || "pending"; render(); return; }
    if (act === "req-open") {
      const s = (state.signups || []).find((x) => x.id === id);
      if (s) openSignupReview(s);
      return;
    }
    if (act === "req-decide") {
      decideSignup(id, btn.dataset.decision);
      return;
    }
    if (act === "reg-pick-trip") { regUi.selectedTripId = id; renderRegister(); return; }
    if (act === "reg-send-request") { sendSignupRequest(); return; }
    if (act === "reg-back-form") { regUi.step = "form"; renderRegister(); return; }
    if (act === "reg-check-status") { checkRegStatus(); return; }
    if (act === "returning-diver") { openReturningDiver(); return; }

    if (act === "ret-pick") {
      const c = (state.customers || []).find((x) => x.id === id);
      if (c) openReturningConfirm(c);
      return;
    }
    if (act === "ret-toggle") {
      if (btn.disabled) return;
      ui.retSelected = ui.retSelected || {};
      ui.retSelected[id] = !ui.retSelected[id];
      return;
    }
    if (act === "ret-add-selected") { addSelectedReturning(); return; }
    if (act === "ret-mark-showed") {
      setAttendance(id, "showed_up");
      closeModal();
      return;
    }
    if (act === "save-sync") {
      saveSyncSettings();
      if (state.settings.crewKey && state.settings.syncUrl) beginCrewSync();
      else render();
      return;
    }

    if (act === "sync-now") { runSyncNow("manual"); return; }
    if (act === "test-sync") { testSyncConnection(); return; }
    if (act === "pay-filter") { ui.payFilter = btn.dataset.filter; render(); return; }

    if (act === "cust-sort") { ui.custSort = btn.dataset.sort || "name"; render(); return; }
    if (act === "cust-trusted-filter") { ui.custTrustedFilter = btn.dataset.filter || "all"; render(); return; }
    if (act === "toggle-trusted") {
      const box = btn.matches && btn.matches("input[type=checkbox]") ? btn : btn.querySelector("input[type=checkbox]");
      const on = box ? box.checked : !C.isTrustedPerson({ id: id }, state.customers);
      applyTrustedToggle(btn.dataset.kind || "customer", id, on);
      return;
    }
    if (act === "save-trusted-note") {
      const box = document.getElementById("p-trusted");
      const note = (document.getElementById("p-trusted-note") || {}).value;
      const on = box ? box.checked : C.isTrustedPerson({ id: id }, state.customers);
      applyTrustedToggle(btn.dataset.kind || "customer", id, on, note);
      toast("Trusted note saved");
      return;
    }
    if (act === "merge-customers") {
      const keepId = id;
      const otherId = btn.dataset.other;
      const keep = state.customers.find((x) => x.id === keepId);
      const other = state.customers.find((x) => x.id === otherId);
      if (!keep || !other) return;
      if (!confirm("Merge " + other.name + " into " + keep.name + "? Trip history is combined and the duplicate record is removed.")) return;
      const res = C.mergeCustomers(state.customers, keepId, otherId, state.trips);
      if (!res.ok) { toast(res.error, true); return; }
      state.customers = res.customers;
      state.trips = res.trips;
      scheduleSave();
      closeModal();
      render();
      const rec = state.customers.find((x) => x.id === keepId);
      if (rec) openPersonDetail(rec, "customer");
      toast("Merged into " + keep.name);
      return;
    }
    if (act === "export-divers-json") {
      downloadText(C.exportFilename("divers"), C.exportDiversDatabase(state), "application/json");
      toast("Divers database exported");
      return;
    }
    if (act === "export-divers-csv") {
      downloadText(C.exportFilename("divers-csv"), C.diversDatabaseCSV(state, state.settings.currency), "text/csv");
      toast("Divers CSV exported");
      return;
    }
    if (act === "import-divers") { $("#import-divers-file").click(); return; }
    if (act === "edit-pay") {
      const d = trip() && trip().divers.find((x) => x.id === id);
      if (d) openPayEditor(d);
      return;
    }
    if (act === "mark-paid") {
      const d = trip() && trip().divers.find((x) => x.id === id);
      if (!d) return;
      const p = C.normalizePayment(d.payment);
      if (p.amount > 0) p.collected = p.amount;
      p.status = "paid";
      if (!p.method) p.method = "cash";
      d.payment = p;
      addLog(C.logEntry("pay", d.name + " marked paid"));
      scheduleSave();
      render();
      toast(d.name + " marked paid");
      return;
    }
    if (act === "new-customer") { openCustomerEditor(); return; }
    if (act === "edit-customer") {
      const c = state.customers.find((x) => x.id === id);
      if (c) openCustomerEditor(c);
      return;
    }
    if (act === "del-customer") {
      const c = state.customers.find((x) => x.id === id);
      if (!c) return;
      if (!confirm("Delete " + c.name + " from the Return Divers database? Trip rosters are kept.")) return;
      state.customers = state.customers.filter((x) => x.id !== id);
      scheduleSave();
      render();
      return;
    }
    if (act === "add-cust-trip") {
      const c = state.customers.find((x) => x.id === id);
      if (c) addDiverToTrip(C.diverFromCustomer(c));
      return;
    }
    if (act === "pick-customer") { openCustomerPicker(); return; }
    if (act === "pick-cust") {
      const c = state.customers.find((x) => x.id === id);
      closeModal();
      if (c) addDiverToTrip(C.diverFromCustomer(c));
      return;
    }
    if (act === "export-json") {
      downloadText(C.exportFilename("backup"), C.exportState(state), "application/json");
      toast("Backup downloaded");
      return;
    }
    if (act === "import-json") { $("#import-file").click(); return; }
    if (act === "export-manifest") {
      if (!trip()) return;
      downloadText(tripFileSlug(trip()) + "-manifest.csv", C.tripManifestCSV(trip()), "text/csv");
      return;
    }
    if (act === "export-payments") {
      if (!trip()) return;
      downloadText(tripFileSlug(trip()) + "-payments.csv", C.tripPaymentsCSV(trip(), state.settings.currency), "text/csv");
      return;
    }
    if (act === "load-example") {
      if (!confirm("Load EXAMPLE data? This replaces all trips and customers currently on this device.")) return;
      state = C.exampleState();
      ui.tab = "roster";
      scheduleSave();
      render();
      toast("EXAMPLE trip loaded");
      return;
    }
    if (act === "wipe") {
      if (!confirm("Erase all BoatCloak data on this device?")) return;
      state = C.emptyState();
      scheduleSave();
      render();
      toast("All data erased");
      return;
    }
    if (act === "show-poster") {
      ui.posterTripId = null;
      if (isPosterMode()) render();
      else location.hash = "#poster";
      return;
    }
    if (act === "show-trip-poster") {
      ui.posterTripId = id;
      if (isPosterMode()) render();
      else location.hash = "#poster";
      return;
    }
    if (act === "back-crew") { ui.posterTripId = null; location.hash = "#/"; return; }
    if (act === "make-poster") {
      state.settings.hostedUrl = val("poster-url");
      scheduleSave();
      renderPoster();
      return;
    }
    if (act === "print-poster") {
      const u = val("poster-url");
      if (u != null) {
        state.settings.hostedUrl = u;
        scheduleSave();
        renderPoster();
      }
      setTimeout(() => window.print(), 50);
      return;
    }
    if (act === "back-to-form") {
      regUi.step = "form";
      if ($("#reg-form")) $("#reg-form").hidden = false;
      if ($("#reg-qr-block")) $("#reg-qr-block").hidden = true;
      return;
    }
  }

  function onChange(e) {
    if (e.target.id === "set-shop") {
      state.settings.shopName = e.target.value;
      scheduleSave();
      $("#brand-name").textContent = C.displayBrand(state.settings.shopName);
    }
    if (e.target.id === "set-cur") {
      state.settings.currency = e.target.value;
      scheduleSave();
    }
    if (e.target.id === "set-hc") {
      setContrast(e.target.checked);
      render();
    }
    if (e.target.id === "set-crew-name") {
      /* saved with Save or when the crew key is entered */
    }
    if (e.target.id === "set-sync-url") {
      saveSyncSettings({ quiet: true });
    }
    if (e.target.id === "set-crew-key") {
      saveSyncSettings({ quiet: true });
      if (String(state.settings.crewKey || "").trim()) beginCrewSync();
    }
    if (e.target.id === "import-file" && e.target.files && e.target.files[0]) {
      const f = e.target.files[0];
      const reader = new FileReader();
      reader.onload = () => {
        const res = C.importState(String(reader.result));
        if (!res.ok) { toast(res.error, true); return; }
        if (!confirm("Replace all data on this device with this backup?")) return;
        state = res.state;
        scheduleSave();
        render();
        toast("Backup imported");
      };
      reader.readAsText(f);
      e.target.value = "";
    }
    if (e.target.id === "import-divers-file" && e.target.files && e.target.files[0]) {
      const f = e.target.files[0];
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result);
        const looksCsv = /\.csv$/i.test(f.name) || (text && !text.trim().startsWith("{") && /,/.test(text.split("\n")[0] || ""));
        const res = looksCsv ? C.importDiversCSV(text, state) : C.importDiversDatabase(text, state);
        if (!res.ok) { toast(res.error, true); return; }
        const msg = "Import " + (res.created || 0) + " new and update " + (res.updated || 0) + " existing divers?";
        if (!confirm(msg)) return;
        state = res.state;
        scheduleSave();
        ui.tab = "customers";
        render();
        toast("Divers database updated");
      };
      reader.readAsText(f);
      e.target.value = "";
    }
  }

  function onInput(e) {
    if (e.target.id === "roster-search") {
      ui.search = e.target.value;
      clearTimeout(onInput._t);
      onInput._t = setTimeout(() => render(), 80);
    }
    if (e.target.id === "cust-search") {
      ui.custSearch = e.target.value;
      clearTimeout(onInput._t);
      onInput._t = setTimeout(() => render(), 80);
    }
  }

  function bindPhoneListeners() {
    if (bindPhoneListeners.bound) return;
    bindPhoneListeners.bound = true;
    document.addEventListener("input", (e) => {
      const el = e.target;
      if (!el || el.tagName !== "INPUT" || String(el.type).toLowerCase() !== "tel") return;
      if (C.formatPhoneInput) C.formatPhoneInput(el, { partial: true });
    });
    document.addEventListener("focusout", (e) => {
      const el = e.target;
      if (!el || el.tagName !== "INPUT" || String(el.type).toLowerCase() !== "tel") return;
      if (C.formatPhoneInput) C.formatPhoneInput(el, { partial: false });
    });
  }

  async function init() {
    bindPhoneListeners();
    state = await loadState();
    if (!state || !state.settings) state = C.emptyState();
    document.documentElement.classList.toggle("hc", !!state.settings.highContrast);
    document.addEventListener("click", onClick);
    document.addEventListener("change", onChange);
    document.addEventListener("input", onInput);
    $$(".tab").forEach((tab) => {
      tab.addEventListener("click", () => { ui.tab = tab.dataset.tab; render(); });
    });
    $("#btn-contrast").addEventListener("click", () => {
      setContrast(!state.settings.highContrast);
      render();
    });
    window.addEventListener("hashchange", render);
    document.addEventListener("submit", (e) => {
      if (e.target && e.target.id === "reg-form") {
        e.preventDefault();
        const rec = readRegForm();
        if (!requirePersonOrToast(rec, "r-ad")) return;
        afterRegForm(rec);
      }
    });
    if (S) prevFlat = S.flatten(state);
    if (lastMigration.migrated) await persistState(state);
    const filled = await applySiteConfigIfNeeded();
    render();
    registerSW();
    updateSwStatus();
    if (filled && filled.changed && S && S.configured(state.settings)) await beginCrewSync();
    else maybeSync("open");
    if (!syncInterval) {
      syncInterval = setInterval(() => {
        if (typeof document === "undefined" || document.visibilityState === "visible") maybeSync("interval");
      }, 30000);
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") maybeSync("visible");
    });
    window.addEventListener("online", () => maybeSync("online"));
  }

  function registerSW() {
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "http:" && location.protocol !== "https:") return;
    navigator.serviceWorker.register("./sw.js").then(() => updateSwStatus()).catch(() => {});
  }

  function updateSwStatus() {
    const el = $("#sw-status");
    if (!el) return;
    if (!("serviceWorker" in navigator)) {
      el.textContent = "Service worker not supported in this browser.";
      return;
    }
    if (!window.isSecureContext) {
      el.textContent = "Offline install needs https (or localhost).";
      return;
    }
    navigator.serviceWorker.getRegistration().then((r) => {
      el.textContent = r
        ? "Offline cache is ready. This app works without a signal once it has been opened on this device."
        : "Offline cache is not registered yet.";
    });
  }

  const api = {
    version: APP_VERSION,
    name: C.APP_NAME || "BoatCloak",
    core: C,
    sync: S,
    getState: () => state,
    setState: (s) => { state = s; prevFlat = S ? S.flatten(state) : prevFlat; return scheduleSave(); },
    loadExample: () => {
      const keep = {
        syncUrl: state.settings && state.settings.syncUrl,
        crewKey: state.settings && state.settings.crewKey,
        crewName: state.settings && state.settings.crewName,
        lastSyncAt: state.settings && state.settings.lastSyncAt,
      };
      state = C.exampleState();
      if (keep.syncUrl) state.settings.syncUrl = keep.syncUrl;
      if (keep.crewKey) state.settings.crewKey = keep.crewKey;
      if (keep.crewName) state.settings.crewName = keep.crewName;
      if (keep.lastSyncAt) state.settings.lastSyncAt = keep.lastSyncAt;
      const applied = C.applySiteSyncUrl(state.settings, siteSyncConfig);
      state.settings = applied.settings;
      prevFlat = S ? S.flatten(C.emptyState()) : prevFlat;
      return scheduleSave().then(() => { render(); return state; });
    },
    lastMigration: () => lastMigration,
    syncNow: () => runSyncNow("manual"),
    applySiteConfigIfNeeded,
    siteSyncConfig: () => siteSyncConfig,
    openReturningDiver: () => openReturningDiver(),
    addReturning: (customerId, opts) => {
      const c = (state.customers || []).find((x) => x.id === customerId);
      if (!c) return { ok: false, error: "Not found" };
      const d = C.prepareReturningDiver(c, state.trips, (opts && opts.overrides) || {});
      return addDiverToTrip(d, opts || {});
    },
    render,
    encodePayload: C.encodePayload,
    decodePayload: C.decodePayload,
    drawQrOnCanvas,
    registerUrl,
    addDiverToTrip,
    setAttendance,
    attendanceCount: () => (trip() ? C.attendanceCount(trip().divers) : null),
    customerHistory: (c) => C.customerHistory(c, state.trips),
    mergeCustomers: (keepId, otherId) => {
      const res = C.mergeCustomers(state.customers, keepId, otherId, state.trips);
      if (res.ok) { state.customers = res.customers; state.trips = res.trips; scheduleSave(); render(); }
      return res;
    },
    paymentTotals: () => (trip() ? C.paymentTotals(trip().divers) : null),
    exportState: () => C.exportState(state),
    importState: (json) => {
      const r = C.importState(json);
      if (r.ok) { state = r.state; scheduleSave(); render(); }
      return r;
    },
    trip,
    setTab: (t) => { ui.tab = t; render(); },
    ui,
  };
  window.BoatCloak = api;
  window.BoatCheck = api;

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
  
</body>
</html>
