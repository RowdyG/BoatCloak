<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BoatCloak">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="BoatCloak: offline dive-boat roster, attendance check-in, paid/unpaid check, and QR registration.">
  <title>BoatCloak — Dive Boat Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
/* BoatCloak v1.3.0 — mobile-first, sun-readable, one-handed */
:root {
  --navy: #07131f;
  --navy-2: #0b1c2e;
  --surface: #10253a;
  --card: #15304a;
  --card-2: #1a3a58;
  --line: #2a4d6e;
  --text: #eef5fb;
  --muted: #9ab0c4;
  --teal: #1ec8c0;
  --teal-dim: #0e5f5c;
  --orange: #ff6a2e;
  --amber: #ffb020;
  --red: #ff4d3a;
  --green: #3dd68c;
  --blue: #4da3ff;
  --cream: #fff6e6;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
  --radius: 16px;
  --tap: 52px;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --banner-h: 0px;
  --header-h: 56px;
  --dock-h: 72px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
html.hc {
  --navy: #FFFFFF;
  --navy-2: #FFFFFF;
  --surface: #FFFFFF;
  --card: #FFFFFF;
  --card-2: #FFFFFF;
  --line: #000000;
  --text: #000000;
  --muted: #000000;
  --teal: #000000;
  --teal-dim: #FFFFFF;
  --orange: #9B0000;
  --amber: #6B4A00;
  --red: #9B0000;
  --green: #005A00;
  --blue: #000000;
  --cream: #000000;
  --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--navy); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.35; min-height: 100%; }
html.hc body { font-size: 18px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
img { max-width: 100%; }
a { color: var(--teal); }

.app { min-height: 100dvh; display: flex; flex-direction: column; background:
  radial-gradient(1200px 500px at 50% -200px, #12344c 0%, transparent 70%), var(--navy); }
html.hc .app { background: #000; }

.header {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 8px;
  padding: calc(8px + var(--safe-t)) 10px 8px;
  background: color-mix(in srgb, var(--navy) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  min-height: calc(var(--header-h) + var(--safe-t));
}
html.hc .header { background: #000; border-bottom-width: 2px; }
.header .brand { font-weight: 800; letter-spacing: .02em; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.header .brand .mark { width: 32px; height: 32px; border-radius: 50%; background: #FFFBEF; display: grid; place-items: center; overflow: hidden; flex-shrink: 0; }
.header .brand .mark img { width: 32px; height: 32px; display: block; }
.trip-line-row { display: flex; align-items: center; gap: 2px; min-width: 0; }
.header .trip-line {
  font-size: .75rem; color: var(--muted); font-weight: 600; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 36vw;
  text-align: left; padding: 0; min-height: 28px; background: none; border: 0;
}
.header .trip-line.has-trip { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
#btn-edit-trip { width: 40px; height: 40px; flex-shrink: 0; }
.banner-row { align-items: center; gap: 8px; }
.banner-row .grow { min-width: 0; }
.sync-chip {
  min-width: 44px; height: 32px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font-weight: 800; font-size: .7rem; letter-spacing: .04em; text-transform: uppercase;
  flex-shrink: 0;
}
.sync-chip.synced { color: var(--green); border-color: var(--green); }
.sync-chip.syncing { color: var(--teal); border-color: var(--teal); }
.sync-chip.pending { color: var(--amber); border-color: var(--amber); }
.sync-chip.error { color: var(--red); border-color: var(--red); }
html.hc .sync-chip { border-width: 2px; background: #000; }
.sync-status { font-weight: 700; font-size: .85rem; margin: 8px 0; }
.sync-status.synced { color: var(--green); }
.sync-status.error { color: var(--red); }
.sync-status.pending { color: var(--amber); }
.icon-btn {
  width: var(--tap); height: var(--tap); min-width: var(--tap);
  border-radius: 14px; display: grid; place-items: center;
  color: var(--text); background: var(--surface); border: 1px solid var(--line);
}
.icon-btn:active { transform: scale(.97); }
.icon-btn[aria-pressed="true"] { background: var(--teal); color: #06211f; border-color: var(--teal); }
html.hc .icon-btn[aria-pressed="true"] { color: #000; }
.grow { flex: 1; min-width: 0; }

.banner {
  position: sticky; top: calc(var(--header-h) + var(--safe-t) - 8px); z-index: 30;
  margin: 8px 10px 0; padding: 12px 14px; border-radius: 14px;
  background: var(--card); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  box-shadow: var(--shadow);
}
.banner .count { font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; }
.banner .sub { color: var(--muted); font-size: .85rem; font-weight: 600; }
.banner.warn { background: #3a1d10; border-color: var(--orange); }
.banner.warn .count { color: var(--orange); }
.banner.ok { background: #102a1e; border-color: var(--green); }
.banner.danger { background: #3a1210; border-color: var(--red); animation: pulse 1.2s ease-in-out infinite; }
.banner.danger .count { color: var(--red); }
html.hc .banner { border-width: 3px; background: #000; }
html.hc .banner.warn, html.hc .banner.danger, html.hc .banner.ok { background: #000; }
@keyframes pulse { 50% { filter: brightness(1.15); } }

.tabs {
  display: flex; gap: 6px; padding: 10px 10px 0; overflow-x: auto;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 0 auto; min-width: 68px; height: 42px; padding: 0 12px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  color: var(--muted); font-weight: 700; font-size: .9rem;
}
.tab[aria-selected="true"] { background: var(--teal); color: #06211f; border-color: var(--teal); }
html.hc .tab[aria-selected="true"] { color: #000; border-width: 2px; }
html.hc .tab { border-width: 2px; color: #fff; }

main.view { flex: 1; padding: 10px 10px calc(var(--dock-h) + var(--safe-b) + 16px); }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; margin-bottom: 10px;
}
html.hc .card { border-width: 2px; background: #000; }
.card h2, .section-title { margin: 0 0 8px; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.muted { color: var(--muted); }
.right { margin-left: auto; }
.hidden, [hidden] { display: none !important; }

.diver-card { padding: 12px; }
.diver-card .name { font-weight: 800; font-size: 1.08rem; }
.diver-card .meta { font-size: .85rem; color: var(--muted); margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .75rem; font-weight: 800; letter-spacing: .02em;
  padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  text-transform: uppercase;
}
.chip.st-not_checked_in { color: var(--muted); }
.chip.st-showed_up { color: var(--green); border-color: var(--green); }
.chip.st-no_show { color: var(--orange); border-color: var(--orange); background: #3a1d10; }
.chip.pay-paid { color: var(--green); border-color: var(--green); }
.chip.pay-unpaid { color: var(--red); border-color: var(--red); background: #3a1210; }
.chip.pay-partial { color: var(--amber); border-color: var(--amber); }
html.hc .chip { border-width: 2px; background: #000; }
.chip.return { color: var(--teal); border-color: var(--teal); background: var(--teal-dim); }
html.hc .chip.return { color: var(--teal); background: #000; }
.chip.trusted {
  color: var(--cream); border-color: var(--amber); background: transparent;
  font-weight: 800; letter-spacing: .01em;
}
.trusted-toggle {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 48px; font-weight: 700; margin: 6px 0;
}
.trusted-toggle input { width: 22px; height: 22px; accent-color: currentColor; }
.about-brand { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
.about-brand img { border-radius: 50%; background: #FFFBEF; width: 48px; height: 48px; }
.about-name { font-weight: 800; font-size: 1.15rem; }

.attend-btns { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; align-items: stretch; }
.sbtn {
  min-height: var(--tap); border-radius: 14px; border: 2px solid var(--line);
  background: var(--surface); font-weight: 800; font-size: .82rem; padding: 6px 8px; line-height: 1.15;
}
.sbtn.showed_up { font-size: 1.08rem; min-height: 64px; }
.sbtn.no_show { min-width: 96px; font-size: .82rem; }
.sbtn .t { display: block; font-size: .75rem; font-weight: 700; color: var(--muted); margin-top: 2px; }
.sbtn.active.showed_up { background: #102a1e; border-color: var(--green); color: var(--green); }
.sbtn.active.showed_up .t { color: var(--green); }
.sbtn.active.no_show { background: #3a1d10; border-color: var(--orange); color: var(--orange); }
html.hc .sbtn { border-width: 3px; }
html.hc .sbtn.active { background: #000; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; gap: 8px; padding: 10px 10px calc(10px + var(--safe-b));
  background: linear-gradient(to top, var(--navy) 70%, transparent);
}
.btn {
  min-height: var(--tap); padding: 0 16px; border-radius: 16px;
  background: var(--card); border: 1px solid var(--line); color: var(--text);
  font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--teal); color: #06211f; border-color: var(--teal); }
html.hc .btn.primary { color: #000; border-width: 2px; }
.btn.danger { background: var(--red); color: #fff; border-color: var(--red); }
.btn.warn { background: var(--orange); color: #1a0a00; border-color: var(--orange); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; border-radius: 12px; font-size: .9rem; padding: 0 12px; }
.dock .btn { flex: 1; }
.dock.triple .btn { font-size: .85rem; padding: 0 8px; gap: 4px; }
@media (max-width: 360px) {
  .dock.triple .btn { font-size: .78rem; padding: 0 6px; }
}
.ret-row, .ret-pick {
  display: flex; align-items: flex-start; gap: 10px; text-align: left;
  width: 100%; margin-bottom: 6px; padding: 10px 12px; min-height: 52px;
}
.ret-pick { justify-content: flex-start; flex-direction: column; align-items: flex-start; }
.ret-pick .meta { font-size: .8rem; color: var(--muted); font-weight: 600; }
.ret-row.disabled, .ret-pick[data-already="1"] { opacity: .85; }
.ret-row .name, .ret-pick .name { font-weight: 800; }
.ret-row input { margin-top: 4px; width: 22px; height: 22px; flex-shrink: 0; }

.field { margin: 0 0 10px; }
.field label { display: block; font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; min-height: var(--tap); padding: 10px 12px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--navy-2); color: var(--text);
}
html.hc .field input, html.hc .field select, html.hc .field textarea { border-width: 2px; background: #000; }
.field textarea { min-height: 88px; resize: vertical; }
.field .hint { font-size: .75rem; color: var(--muted); margin-top: 4px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 360px) { .grid-2 { grid-template-columns: 1fr; } .attend-btns { grid-template-columns: 1fr; } }

.gear { display: flex; flex-wrap: wrap; gap: 6px; }
.gear label {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px;
  padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 700; font-size: .85rem; user-select: none;
}
.gear input { accent-color: var(--teal); width: 18px; height: 18px; }
.gear label:has(input:checked) { border-color: var(--teal); background: var(--teal-dim); color: var(--cream); }
html.hc .gear label:has(input:checked) { background: #000; color: var(--teal); border-width: 2px; }

.search {
  width: 100%; min-height: 44px; padding: 8px 12px 8px 36px; margin-bottom: 10px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--navy-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' fill='none' stroke='%239ab0c4' stroke-width='2' viewBox='0 0 24 24'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3-3'/></svg>") no-repeat 10px 50%;
  color: var(--text);
}

.totals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.tot { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.tot .k { font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tot .v { font-size: 1.25rem; font-weight: 800; margin-top: 2px; }
.tot.out .v { color: var(--red); }
.tot.in .v { color: var(--green); }

.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
.filters button {
  min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 700; white-space: nowrap;
}
.filters button[aria-pressed="true"] { background: var(--teal); color: #06211f; border-color: var(--teal); }
html.hc .filters button[aria-pressed="true"] { color: #000; }

.log { list-style: none; margin: 0; padding: 0; }
.log li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.log .ts { color: var(--muted); font-size: .75rem; font-weight: 700; font-variant-numeric: tabular-nums; }

.trip-item { display: flex; align-items: center; gap: 10px; }
.trip-item .when { font-weight: 800; }
.trip-item .who { color: var(--muted); font-size: .85rem; }
.badge-ex { background: #3a1d10; color: var(--orange); border: 1px solid var(--orange); font-size: .65rem; font-weight: 800; padding: 2px 6px; border-radius: 999px; letter-spacing: .06em; }


.contact { margin-top: 10px; display: grid; gap: 6px; }
.contact-row { display: grid; grid-template-columns: 7.4em 1fr; gap: 8px; align-items: start; }
.contact-row .k {
  font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
  font-size: .72rem; color: var(--muted); padding-top: 6px;
}
.contact-row .v { font-size: .95rem; font-weight: 650; min-width: 0; }
.contact-row .address { white-space: pre-wrap; line-height: 1.35; }
a.tel {
  color: var(--teal); font-weight: 800; text-decoration: none;
  display: inline-flex; align-items: center; min-height: 36px;
  border-bottom: 1px solid color-mix(in srgb, var(--teal) 50%, transparent);
}
html.hc a.tel { color: var(--teal); text-decoration: underline; border-bottom: 0; }
.missing { color: var(--muted); font-weight: 600; }

/* Overlays */
.overlay {
  position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.72);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 12px 10px calc(12px + var(--safe-b));
}
.sheet {
  width: min(560px, 100%); max-height: min(92dvh, 920px); overflow: auto;
  background: var(--navy-2); border: 1px solid var(--line); border-radius: 20px 20px 16px 16px;
  padding: 8px 14px 16px; box-shadow: var(--shadow);
}
.sheet .grab { width: 42px; height: 4px; border-radius: 4px; background: var(--line); margin: 6px auto 10px; }
.sheet h2 { margin: 0 0 10px; font-size: 1.15rem; }
.alert-box {
  position: relative; width: min(520px, 100%);
  background: #2a0d0c; border: 3px solid var(--red); border-radius: 20px;
  padding: 18px 16px; color: #fff; box-shadow: var(--shadow);
  margin: auto;
}
.overlay.center { align-items: center; }
.alert-box h2 { margin: 0 0 8px; color: var(--red); font-size: 1.4rem; letter-spacing: .02em; text-transform: uppercase; }
.alert-box ul { margin: 8px 0 14px; padding-left: 1.1em; font-weight: 700; font-size: 1.05rem; }
html.hc .alert-box { background: #000; border-width: 4px; }

/* Scanner */
.scanner {
  position: fixed; inset: 0; z-index: 90; background: #000; display: flex; flex-direction: column;
}
.scanner video, .scanner canvas.view { width: 100%; flex: 1; object-fit: cover; background: #000; }
.scanner canvas.view { display: none; }
.scanner .hud {
  position: absolute; inset: 0; pointer-events: none;
  display: grid; place-items: center;
}
.finder {
  width: min(72vw, 320px); aspect-ratio: 1; border: 3px solid var(--teal);
  border-radius: 20px; box-shadow: 0 0 0 999px rgba(0,0,0,.45);
}
.scanner .bar {
  position: relative; z-index: 2;
  padding: 10px 10px calc(12px + var(--safe-b));
  display: flex; gap: 8px; background: #000;
}
.scanner .status { text-align: center; padding: 8px 16px 4px; font-weight: 700; color: var(--cream); line-height: 1.3; }

/* Register mode */
.reg {
  min-height: 100dvh; padding: calc(12px + var(--safe-t)) 14px calc(24px + var(--safe-b));
  max-width: 560px; margin: 0 auto;
}
.reg h1 { margin: 8px 0 4px; font-size: 1.6rem; }
.qr-wrap {
  background: #fff; border-radius: 16px; padding: 14px; margin: 12px 0;
  display: grid; place-items: center;
}
.qr-wrap canvas, .qr-wrap img { width: min(78vw, 320px); height: auto; }
.reg-actions { display: grid; gap: 8px; }

/* Poster */
.poster-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
@media print {
  body { background: #fff; color: #000; }
  .app, .header, .banner, .tabs, .dock, .overlay, .scanner, #toast { display: none !important; }
  .print-only { display: block !important; }
  .poster {
    display: block; width: 100%; text-align: center; padding: 12mm;
    font-family: var(--font); color: #000;
  }
  .poster h1 { font-size: 28pt; margin: 0 0 4mm; }
  .poster .qr { margin: 8mm auto; }
}
.print-only { display: none; }
.poster-preview {
  background: #fff; color: #07131f; border-radius: 16px; padding: 20px; text-align: center; margin: 10px 0;
}
.poster-preview h1 { margin: 0 0 6px; font-size: 1.5rem; color: #07131f; }
.poster-preview canvas { width: min(70vw, 280px); height: auto; }

#toast {
  position: fixed; left: 50%; bottom: calc(var(--dock-h) + var(--safe-b) + 8px);
  transform: translateX(-50%) translateY(12px);
  z-index: 70; background: var(--cream); color: #07131f;
  padding: 12px 16px; border-radius: 14px; font-weight: 800;
  box-shadow: var(--shadow); max-width: 90vw;
  opacity: 0; pointer-events: none;
  transition: transform .25s ease, opacity .25s ease;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
#toast.err { background: var(--red); color: #fff; }

.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty h3 { color: var(--text); margin: 0 0 6px; }

.sw-note { font-size: .8rem; color: var(--muted); padding: 8px 2px; }

.dup-warn { background: #3a1d10; border: 2px solid var(--orange); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-weight: 700; }

hr.sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

.list-btn { width: 100%; text-align: left; padding: 0; background: none; border: 0; color: inherit; }

.history { margin-top: 12px; }
.history-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.history-stats .tot { padding: 10px; }

.k-label { display: block; font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg-opt {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); border-radius: 14px; border: 2px solid var(--line);
  background: var(--surface); font-weight: 800; padding: 0 10px;
}
.seg-opt:has(input:checked) { border-color: var(--teal); background: var(--teal-dim); color: var(--cream); }
html.hc .seg-opt:has(input:checked) { background: #000; color: var(--teal); border-width: 3px; }
.seg-opt input { accent-color: var(--teal); width: 18px; height: 18px; }
.chip.act-fun { color: var(--blue); border-color: var(--blue); }
.chip.act-class { color: var(--teal); border-color: var(--teal); }
.group-h { display: flex; align-items: center; gap: 8px; margin: 16px 2px 8px; font-weight: 800; font-size: .9rem; text-transform: uppercase; letter-spacing: .06em; }
.group-h .n { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; min-width: 28px; text-align: center; }
.group-h.fun { color: var(--blue); }
.group-h.class { color: var(--teal); }
#banner-activity { font-weight: 800; margin-top: 2px; }

.tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px; margin-left: 4px;
  border-radius: 999px; background: var(--orange); color: #1a0a00;
  font-size: .7rem; font-weight: 800;
}
.tab[aria-selected="true"] .tab-badge { background: #06211f; color: var(--teal); }
html.hc .tab[aria-selected="true"] .tab-badge { background: #fff; color: #000; }
.signup-open { color: var(--teal); font-weight: 800; font-size: .8rem; }
.req-card { padding: 12px; }
.req-card .ref { font-family: ui-monospace, monospace; font-weight: 800; letter-spacing: .06em; }
.req-status { text-transform: uppercase; font-size: .75rem; font-weight: 800; }
.req-status.pending { color: var(--amber); }
.req-status.approved { color: var(--green); }
.req-status.declined { color: var(--red); }
.req-status.waitlist { color: var(--teal); }
.open-trip-card {
  text-align: left; width: 100%; margin-bottom: 8px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start;
  height: auto; min-height: 0; padding: 12px 14px; white-space: normal; line-height: 1.35; gap: 2px;
}
.open-trip-card .when, .open-trip-card .meta, .open-trip-card .seats { width: 100%; }
.open-trip-card .when { font-weight: 800; }
.open-trip-card .meta { font-weight: 600; color: var(--muted); font-size: .9rem; }
.open-trip-card .seats { font-weight: 800; color: var(--teal); }
.open-trip-card.full .seats { color: var(--orange); }
.open-trip-card.selected { border-color: var(--teal); box-shadow: 0 0 0 2px color-mix(in srgb, var(--teal) 40%, transparent); }
.ref-hero {
  text-align: center; padding: 16px 12px; margin: 12px 0;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
}
.ref-hero .code { font-size: 2rem; font-weight: 800; letter-spacing: .14em; font-family: ui-monospace, monospace; }
.offline-signup-note {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; margin: 0 0 12px; font-weight: 700;
}


/* Sun mode — maximum contrast for direct sunlight. Dark mode (:root) is unchanged. */
html.hc, html.hc body {
  background: #FFFFFF;
  color: #000000;
  font-size: 17px;
  font-weight: 600;
}
html.hc .app,
html.hc .reg,
html.hc .poster,
html.hc #app-poster,
html.hc #app-register {
  background: #FFFFFF;
  color: #000000;
}
html.hc .header,
html.hc .dock,
html.hc .banner,
html.hc .card,
html.hc .sheet,
html.hc .modal-card,
html.hc .alert-box,
html.hc .sync-chip,
html.hc .chip,
html.hc .ref-hero,
html.hc .search,
html.hc .field input,
html.hc .field select,
html.hc .field textarea,
html.hc .tot {
  background: #FFFFFF !important;
  color: #000000 !important;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow: none;
  border-color: #000000;
  border-style: solid;
  border-width: 2px;
}
html.hc .header { border-bottom-width: 3px; }
html.hc .dock { border-top-width: 3px; background: #FFFFFF !important; }
html.hc .btn,
html.hc button.btn,
html.hc .sbtn,
html.hc .tab,
html.hc .filters button,
html.hc .icon-btn,
html.hc .seg-opt,
html.hc .ret-pick,
html.hc .ret-row,
html.hc .open-trip-card {
  min-height: 48px;
  min-width: 48px;
  font-weight: 700;
  border: 2px solid #000000;
  background: #FFFFFF;
  color: #000000;
  box-shadow: none;
  background-image: none;
}
html.hc .btn.primary,
html.hc .sbtn.active,
html.hc .tab[aria-selected="true"],
html.hc .filters button[aria-pressed="true"],
html.hc .seg-opt:has(input:checked),
html.hc .icon-btn[aria-pressed="true"],
html.hc .gear label:has(input:checked) {
  background: #000000 !important;
  color: #FFFFFF !important;
  border-color: #000000 !important;
}
html.hc .btn.danger,
html.hc .sbtn.no_show.active {
  background: #FFFFFF !important;
  color: #9B0000 !important;
  border-color: #9B0000 !important;
}
html.hc a, html.hc a.tel { color: #000000; text-decoration: underline; font-weight: 700; }
html.hc .muted, html.hc .meta, html.hc .hint, html.hc .sub, html.hc .who, html.hc .trip-line, html.hc .sw-note {
  color: #000000 !important;
  font-weight: 600;
  opacity: 1;
}
html.hc .chip.st-showed_up,
html.hc .sbtn.showed_up.active,
html.hc .signup-open,
html.hc .req-status.approved,
html.hc .tot.in .v {
  color: #005A00 !important;
  border-color: #005A00 !important;
  background: #FFFFFF !important;
  font-weight: 800;
}
html.hc .sbtn.showed_up.active { color: #FFFFFF !important; background: #005A00 !important; }
html.hc .chip.st-no_show,
html.hc .req-status.declined,
html.hc .offline-signup-note {
  color: #9B0000 !important;
  border-color: #9B0000 !important;
  background: #FFFFFF !important;
  font-weight: 800;
}
html.hc .chip.st-not_checked_in,
html.hc .chip.pay-unpaid,
html.hc .chip.pay-partial,
html.hc .req-status.pending,
html.hc .req-status.waitlist,
html.hc .banner.warn {
  color: #6B4A00 !important;
  border-color: #6B4A00 !important;
  background: #FFFFFF !important;
  font-weight: 800;
}
html.hc .chip.trusted {
  background: #000000 !important;
  color: #FFFFFF !important;
  border: 2px solid #000000 !important;
  font-weight: 800;
}
html.hc :focus, html.hc :focus-visible {
  outline: 3px solid #000000;
  outline-offset: 2px;
}
html.hc button:disabled, html.hc [disabled] {
  color: #4A4A4A !important;
  border-color: #4A4A4A !important;
  background: #FFFFFF !important;
  opacity: 1;
  font-weight: 700;
}
html.hc .open-trip-card.selected { box-shadow: none; border-width: 3px; }

</style>

<body>
  <div id="app-crew" class="app">
    <header class="header">
      <button class="icon-btn" data-act="show-trips-tab" id="btn-trips" aria-label="Trips" title="Trips">☰</button>
      <div class="grow">
        <div class="brand">
          <span class="mark"><img src="icons/logo-emblem.png" width="32" height="32" alt=""></span>
          <span id="brand-name">BoatCloak</span>
        </div>
        <div class="trip-line-row">
          <button type="button" class="trip-line" id="trip-line" data-act="edit-current-trip" aria-label="Current trip">No trip open</button>
          <button type="button" class="icon-btn" id="btn-edit-trip" data-act="edit-current-trip" aria-label="Edit trip" title="Edit trip" hidden>✎</button>
        </div>
      </div>
      <button class="sync-chip local" id="sync-chip" data-act="sync-now" title="Shared sync" aria-label="Local only">Local</button>
      <button class="icon-btn" id="btn-contrast" aria-label="High contrast" aria-pressed="false" title="High-contrast (sun) mode">☀</button>
    </header>
    <div id="banner" class="banner" hidden></div>
    <nav class="tabs" role="tablist" aria-label="Main">
      <button class="tab" role="tab" data-tab="roster" aria-selected="true">Roster</button>
      <button class="tab" role="tab" data-tab="board">Check-in</button>
      <button class="tab" role="tab" data-tab="pay">Pay</button>
      <button class="tab" role="tab" data-tab="customers">Divers</button>
      <button class="tab" role="tab" data-tab="trips">Trips</button>
      <button class="tab" role="tab" data-tab="requests">Requests <span class="tab-badge" id="req-badge" hidden></span></button>
      <button class="tab" role="tab" data-tab="more">More</button>
    </nav>
    <main id="view" class="view"></main>
    <footer class="dock" id="dock"></footer>
  </div>

  <div id="app-register" hidden></div>
  <div id="app-poster" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  function decodePayload(text) {
    const raw = String(text || "").trim();
    if (!raw) return { ok: false, error: "Empty QR data" };
    let jsonStr = null;
    let via = "";
    if (raw.indexOf(PAYLOAD_PREFIX_V3) === 0) {
      jsonStr = raw.slice(PAYLOAD_PREFIX_V3.length);
      via = "v3";
    } else if (raw.indexOf(PAYLOAD_PREFIX_V2) === 0) {
      jsonStr = raw.slice(PAYLOAD_PREFIX_V2.length);
      via = "v2";
    } else if (raw.indexOf(PAYLOAD_PREFIX) === 0) {
      try {
        jsonStr = base64UrlDecode(raw.slice(PAYLOAD_PREFIX.length));
      } catch (e) {
        return { ok: false, error: "QR data is not valid BoatCloak encoding" };
      }
      via = "v1";
    } else if (raw.charAt(0) === "{") {
      jsonStr = raw;
      via = "json";
    } else {
      return { ok: false, error: "Not a BoatCloak diver QR" };
    }
    let obj;
    try {
      obj = JSON.parse(jsonStr);
    } catch (e) {
      return { ok: false, error: "QR JSON could not be parsed" };
    }
    if (!obj || typeof obj !== "object") return { ok: false, error: "QR JSON is empty" };
    const ver = obj.v == null ? 1 : obj.v;
    if (ver !== 1 && ver !== 2 && ver !== 3) return { ok: false, error: "Unsupported QR version " + ver };
    const given = obj.x;
    const expect = checksum(canonicalBody(obj));
    if (!given || given !== expect) {

    const keys = ver === 1 ? QR_KEYS_V1 : ver === 2 ? QR_KEYS_V2 : QR_KEYS;
    Object.keys(keys).forEach((k) => {

    }
    diver.name = String(diver.name).trim();
    return { ok: true, diver: diver, raw: obj, version: ver, via: via };
  }

    const bytes = unescape(encodeURIComponent(str));

    return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");

    "082": 1, "083": 1, "084": 1, "085": 1, "086": 1, "087": 1, "088": 1, "089": 1,
    "092": 1, "093": 1, "094": 1, "095": 1, "096": 1, "097": 1, "098": 1, "099": 1
  };
  var JP_SPECIAL_4 = { "0120": 1, "0800": 1, "0570": 1, "0990": 1, "0160": 1, "0180": 1, "0130": 1, "0140": 1 };

  function groupDigits(d, sizes, sep) {
    sep = sep || "-";
    const parts = [];
    let i = 0;
    for (let s = 0; s < sizes.length && i < d.length; s++) {
      parts.push(d.slice(i, i + sizes[s]));
      i += sizes[s];
    }
    if (i < d.length) parts.push(d.slice(i));
    return parts.filter(function (p) { return p; }).join(sep);
  }

  function jpLandlineGroups(d) {
    if (JP_AREA_5[d.slice(0, 5)]) return [5, 1, 4];
    if (JP_SPECIAL_4[d.slice(0, 4)]) return [4, 3, 3];
    if (JP_AREA_4[d.slice(0, 4)]) return [4, 2, 4];
    if (d.slice(0, 2) === "03" || d.slice(0, 2) === "06") return [2, 4, 4];
    if (JP_AREA_3[d.slice(0, 3)]) return [3, 3, 4];
    return [4, 2, 4];
  }

  function formatJpNational(d, partial) {
    if (!d) return "";
    if (/^(070|080|090|050)/.test(d)) return groupDigits(d, [3, 4, 4], "-");
    if (d.length < 10 && !partial) return "";
    if (d.length < 10) return d;
    return groupDigits(d, jpLandlineGroups(d), "-");
  }

  function jpNationalFromIntl(rest) {
    if (!rest) return "";
    if (rest.charAt(0) === "0") return rest;
    return "0" + rest;
  }

  function formatUsNational(d, partial) {
    if (d.length <= 3) return d;
    if (d.length <= 6) return "(" + d.slice(0, 3) + ") " + d.slice(3);
    return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6, 10);
  }

  function hasPhoneLetters(s) {
    return /[a-zA-Z]/.test(s);
  }

  function formatPhone(value, opts) {
    opts = opts || {};
    const raw = value == null ? "" : String(value);
    const s = opts.partial ? raw : raw.trim();
    if (!s) return opts.partial ? raw : "";
    if (hasPhoneLetters(s)) return opts.partial ? raw : s;
    const hadPlus = /^\s*\+/.test(s);
    const d = phoneDigits(s);
    if (!d) return s;

    // Japan international: +81 or leading 81 + national number
    const jpIntl = (hadPlus && d.indexOf("81") === 0 && d.length >= 2) ||
      (!hadPlus && d.indexOf("81") === 0 && d.length >= 11);
    if (jpIntl) {
      const rest = jpNationalFromIntl(d.slice(2));
      if (d.length <= 2) return "+81";
      if (opts.partial && rest.length < 3) return "+81 " + (rest.charAt(0) === "0" ? rest.slice(1) : rest);
      const local = formatJpNational(rest, opts.partial);
      if (!local) return opts.partial ? s : raw.trim();
      const body = local.charAt(0) === "0" ? local.slice(1) : local;
      return body ? "+81 " + body : "+81";
    }

    // US international: +1 or 1 + 10-digit NANP
    const usIntl = (hadPlus && d.charAt(0) === "1") ||
      (d.length === 11 && d.charAt(0) === "1" && d.charAt(1) >= "2" && d.charAt(1) <= "9");
    if (usIntl && (d.length >= 11 || hadPlus)) {
      const rest = d.charAt(0) === "1" ? d.slice(1) : d;
      if (!opts.partial && rest.length !== 10) return s;
      if (opts.partial && rest.length < 10) {
        if (!hadPlus && d.length < 11) return s;
        if (rest.length === 0) return "+1";
        return "+1 " + formatUsNational(rest, true);
      }
      if (rest.length === 10 && rest.charAt(0) >= "2" && rest.charAt(0) <= "9") {
        return "+1 " + formatUsNational(rest, false);
      }
      return s;
    }

    // Japan mobile / IP phone (11 digits, 070/080/090/050)
    if (/^(070|080|090|050)/.test(d) && d.length <= 11) {
      if (!opts.partial && d.length !== 11) return s;
      return formatJpNational(d, true);
    }

    // Japan landline / special (10 digits starting with 0)
    if (d.charAt(0) === "0" && d.length === 10) {
      return formatJpNational(d, false);
    }

    // US 10 digits, not starting with 0 or 1
    if (d.length === 10 && d.charAt(0) >= "2" && d.charAt(0) <= "9") {
      return formatUsNational(d, false);
    }

    return opts.partial ? raw : s;
  }

  function canonicalPhoneDigits(value) {
    let d = phoneDigits(value);
    if (!d) return "";
    if (d.indexOf("81") === 0 && d.length >= 11) {
      d = jpNationalFromIntl(d.slice(2));
    } else if (d.length === 11 && d.charAt(0) === "1" && d.charAt(1) >= "2" && d.charAt(1) <= "9") {
      d = d.slice(1);
    }
    return d;
  }

  function applyStoredPhones(obj) {
    if (!obj || typeof obj !== "object") return obj;
    if (obj.phone != null && String(obj.phone) !== "") obj.phone = formatPhone(obj.phone);
    if (obj.emergencyPhone != null && String(obj.emergencyPhone) !== "") obj.emergencyPhone = formatPhone(obj.emergencyPhone);
    return obj;
  }

  function formatPhoneInput(el, opts) {
    opts = opts || {};
    if (!el) return "";
    const partial = opts.partial !== false;
    const old = String(el.value == null ? "" : el.value);
    const start = typeof el.selectionStart === "number" ? el.selectionStart : old.length;
    const formatted = formatPhone(old, { partial: partial });
    if (formatted === old) return formatted;
    const digitsBefore = phoneDigits(old.slice(0, start)).length;
    const atEnd = start >= old.length;
    el.value = formatted;
    if (typeof el.setSelectionRange === "function") {
      let pos = formatted.length;
      if (!atEnd) {
        if (digitsBefore === 0) {
          pos = start === 0 ? 0 : (formatted.charAt(0) === "+" ? 1 : 0);
        } else {
          let seen = 0;
          pos = formatted.length;
          for (let i = 0; i < formatted.length; i++) {
            if (formatted.charAt(i) >= "0" && formatted.charAt(i) <= "9") {
              seen++;
              if (seen >= digitsBefore) { pos = i + 1; break; }
            }
          }
        }
      }
      try { el.setSelectionRange(pos, pos); } catch (err) {}
    }
    return formatted;
  }

  function phonesMatch(a, b) {
    const pa = canonicalPhoneDigits(a);
    const pb = canonicalPhoneDigits(b);
    if (!pa || !pb) return false;
    if (pa === pb && pa.length >= 7) return true;
    if ((pa.endsWith(pb) || pb.endsWith(pa)) && Math.min(pa.length, pb.length) >= 8) return true;
    return false;
  }

  function samePerson(a, b) {
    if (!a || !b) return false;
    if (a.customerId && b.customerId && a.customerId === b.customerId) return true;
    if (a.id && b.id && a.id === b.id && String(a.id).indexOf("c-") === 0) return true;
    if (phonesMatch(a.phone, b.phone)) return true;
    const na = normKey(a.name);
    const nb = normKey(b.name);
    const ca = normKey(a.certNumber);
    const cb = normKey(b.certNumber);
    if (na && nb && na === nb && ca && cb && ca === cb && ca.length >= 4) return true;
    if (ca && cb && ca === cb && ca.length >= 4) return true;
    return false;
  }

  function findExistingCustomer(customers, person) {
    const list = customers || [];
    if (!person) return null;
    const id = person.customerId || (String(person.id || "").indexOf("c-") === 0 ? person.id : "");
    if (id) {
      const byId = list.find((c) => c && c.id === id);
      if (byId) return byId;
    }
    const byPhone = list.find((c) => c && phonesMatch(c.phone, person.phone));
    if (byPhone) return byPhone;
    const na = normKey(person.name);
    const ca = normKey(person.certNumber);
    if (na && ca && ca.length >= 4) {
      const byCert = list.find((c) => c && normKey(c.name) === na && normKey(c.certNumber) === ca);
      if (byCert) return byCert;
    }
    return list.find((c) => samePerson(c, person)) || null;
  }

  function findDuplicates(diver, list) {
    return (list || []).filter((x) => {
      if (diver && diver.id && x && x.id && x.id === diver.id) return false;
      return samePerson(diver, x);
    });
  }

  function customerFromDiver(diver) {
    return emptyCustomer({
      id: diver.customerId || uid("c"),
      name: diver.name,
      phone: diver.phone,
      certLevel: diver.certLevel,
      certAgency: diver.certAgency,
      certNumber: diver.certNumber,
      emergencyName: diver.emergencyName,
      emergencyPhone: diver.emergencyPhone,
      address: diver.address,
      notes: diver.notes,
    });
  }

  function diverFromCustomer(c, extra) {
    return emptyDiver(
      Object.assign(
        {
          customerId: c.id,
          name: c.name,
          phone: c.phone,
          certLevel: c.certLevel,
          certAgency: c.certAgency,
          certNumber: c.certNumber,
          emergencyName: c.emergencyName,
          emergencyPhone: c.emergencyPhone,
          address: c.address,
          notes: c.notes,
          addedVia: "customer",
        },
        extra || {}
      )
    );
  }

  function upsertCustomer(customers, diverOrCust) {
    const list = customers ? customers.slice() : [];
    const src = diverOrCust || {};
    const asCust = emptyCustomer({
      id: src.customerId || src.id,
      name: src.name,
      phone: src.phone,
      certLevel: src.certLevel,
      certAgency: src.certAgency,
      certNumber: src.certNumber,
      emergencyName: src.emergencyName,
      emergencyPhone: src.emergencyPhone,
      address: src.address,
      notes: src.notes,
    });
    const hit = findExistingCustomer(list, asCust) || findExistingCustomer(list, src);
    if (hit) {
      ["name", "phone", "address", "certLevel", "certAgency", "certNumber", "emergencyName", "emergencyPhone", "notes"].forEach((k) => {
        if (asCust[k]) hit[k] = asCust[k];
      });
      if (Object.prototype.hasOwnProperty.call(src, "trusted")) hit.trusted = isTrustedFlag(src.trusted);
      if (Object.prototype.hasOwnProperty.call(src, "trustedNote")) hit.trustedNote = String(src.trustedNote || "").slice(0, 200);
      hit.updatedAt = nowISO();
      return { customers: list, customer: hit, created: false };
    }
    const c = asCust;
    c.id = c.id || uid("c");
    c.createdAt = c.createdAt || nowISO();
    c.updatedAt = nowISO();
    list.push(c);
    return { customers: list, customer: c, created: true };
  }

  function diverMatchesCustomer(diver, customer) {
    if (!diver || !customer) return false;
    if (diver.customerId && customer.id && diver.customerId === customer.id) return true;
    if (diver.id && customer.id && diver.id === customer.id) return true;
    return samePerson(diver, customer);
  }

  function appearancesFor(customer, trips) {
    const visits = [];
    const seen = {};
    (trips || []).forEach((trip) => {
      (trip.divers || []).forEach((d) => {
        if (!diverMatchesCustomer(d, customer)) return;
        const pay = normalizePayment(d.payment);
        const act = normalizeActivity(d);
        const rec = {
          tripId: trip.id,
          date: trip.date || "",
          boatName: trip.boatName || "",
          sites: trip.sites || "",
          attendance: attendanceOf(d),
          checkedInAt: d.checkedInAt || null,
          payment: pay,
          outstanding: Math.max(0, (Number(pay.amount) || 0) - (Number(pay.collected) || 0)),
          diverId: d.id,
          activity: act.activity,
          instructor: act.instructor,
          course: act.course,
        };
        visits.push(rec);
        if (trip.id) seen[trip.id] = true;
      });
    });
    (customer.importedVisits || []).forEach((v) => {
      if (!v) return;
      if (v.tripId && seen[v.tripId]) return;
      const pay = normalizePayment(v.payment);
      const act = normalizeActivity(v);
      visits.push({
        tripId: v.tripId || "",
        date: v.date || "",
        boatName: v.boatName || "",
        sites: v.sites || "",
        attendance: v.attendance || "not_checked_in",
        checkedInAt: v.checkedInAt || null,
        payment: pay,
        outstanding: Math.max(0, (Number(pay.amount) || 0) - (Number(pay.collected) || 0)),
        imported: true,
        activity: act.activity,
        instructor: act.instructor,
        course: act.course,
      });
    });
    visits.sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.boatName).localeCompare(String(b.boatName)));
    return visits;
  }

  function customerHistory(customer, trips) {
    const appearances = appearancesFor(customer, trips);
    const showed = appearances.filter((a) => a.attendance === "showed_up");
    const noshow = appearances.filter((a) => a.attendance === "no_show");
    const visitDates = showed.length ? showed : appearances;
    const firstVisit = visitDates.length ? visitDates[0].date : "";
    const lastVisit = visitDates.length ? visitDates[visitDates.length - 1].date : "";
    let due = 0, collected = 0, outstanding = 0;
    appearances.forEach((a) => {
      const p = a.payment || emptyPayment();
      due += Number(p.amount) || 0;
      collected += Number(p.collected) || 0;
      outstanding += a.outstanding || 0;
    });
    return {
      appearances: appearances,
      rosteredCount: appearances.length,
      visitCount: showed.length,
      noShowCount: noshow.length,
      firstVisit: firstVisit,
      lastVisit: lastVisit,
      due: due,
      collected: collected,
      outstanding: outstanding,
      isReturn: appearances.length >= 2,
    };
  }

  function isReturnDiver(customer, trips) {
    return customerHistory(customer, trips).isReturn;
  }

  function sortDivers(customers, trips, sortBy) {
    const list = (customers || []).slice();
    const hist = {};
    const key = (sortBy || "name").toLowerCase();
    list.forEach((c) => { hist[c.id] = customerHistory(c, trips); });
    list.sort((a, b) => {
      const ha = hist[a.id] || {};
      const hb = hist[b.id] || {};
      if (key === "visits") {
        const d = (hb.visitCount || 0) - (ha.visitCount || 0);
        if (d) return d;
        return String(hb.lastVisit || "").localeCompare(String(ha.lastVisit || "")) || String(a.name).localeCompare(String(b.name));
      }
      if (key === "lastvisit" || key === "last_visit") {
        const d = String(hb.lastVisit || "").localeCompare(String(ha.lastVisit || ""));
        if (d) return d;
        return String(a.name).localeCompare(String(b.name));
      }
      return String(a.name || "").localeCompare(String(b.name || ""));
    });
    return list;
  }

  function mergeCustomers(customers, keepId, otherId, trips) {
    const list = (customers || []).slice();
    const keep = list.find((c) => c.id === keepId);
    const other = list.find((c) => c.id === otherId);
    if (!keep || !other || keep.id === other.id) {
      return { ok: false, error: "Pick two different records to merge", customers: customers || [], trips: trips };
    }
    ["name", "phone", "address", "certLevel", "certAgency", "certNumber", "emergencyName", "emergencyPhone"].forEach((k) => {
      if (!keep[k] && other[k]) keep[k] = other[k];
    });
    if (other.notes) {
      keep.notes = keep.notes && keep.notes !== other.notes ? (keep.notes + "\n" + other.notes) : (keep.notes || other.notes);
    }
    if (isTrustedFlag(other.trusted)) keep.trusted = true;
    if (other.trustedNote && !keep.trustedNote) keep.trustedNote = String(other.trustedNote).slice(0, 200);
    const imported = (keep.importedVisits || []).concat(other.importedVisits || []);
    keep.importedVisits = imported;
    keep.updatedAt = nowISO();
    if (keep.createdAt && other.createdAt && other.createdAt < keep.createdAt) keep.createdAt = other.createdAt;
    const nextTrips = (trips || []).map((trip) => {
      const t = trip;
      (t.divers || []).forEach((d) => {
        if (d.customerId === other.id || diverMatchesCustomer(d, other)) d.customerId = keep.id;
      });
      return t;
    });
    const nextCustomers = list.filter((c) => c.id !== other.id);
    return { ok: true, customers: nextCustomers, trips: nextTrips, customer: keep };
  }

  function snapshotVisits(customer, trips) {
    return customerHistory(customer, trips).appearances.map((a) => ({
      tripId: a.tripId || "",
      date: a.date || "",
      boatName: a.boatName || "",
      sites: a.sites || "",
      attendance: a.attendance,
      checkedInAt: a.checkedInAt || null,
      payment: a.payment,
      activity: a.activity || "fun",
      instructor: a.instructor || "",
      course: a.course || "",
    }));
  }

  function exportDiversDatabase(state) {
    const st = state || emptyState();
    const customers = (st.customers || []).map((c) => {
      const out = emptyCustomer(c);
      out.importedVisits = snapshotVisits(c, st.trips);
      return out;
    });
    return JSON.stringify(
      {
        app: APP_NAME,
        type: "divers",
        appVersion: "1.4.4",
        schema: SCHEMA,
        exportedAt: nowISO(),
        currency: (st.settings && st.settings.currency) || "JPY",
        customers: customers,
      },
      null,
      2
    );
  }

  function importDiversDatabase(jsonText, current) {
    let data;
    try {
      data = typeof jsonText === "string" ? JSON.parse(jsonText) : jsonText;
    } catch (e) {
      return { ok: false, error: "File is not valid JSON" };
    }
    if (!data || typeof data !== "object") return { ok: false, error: "File is empty" };
    if (data.app && !isOurAppName(data.app)) return { ok: false, error: "This file is not a BoatCloak export" };
    const st = current ? clone(current) : emptyState();
    let incoming = Array.isArray(data.customers) ? data.customers : [];
    if (!incoming.length && data.type !== "divers") return { ok: false, error: "No diver records in this file" };
    if (Array.isArray(data.trips) && data.trips.length) {
      incoming = incoming.map((c) => {
        const x = emptyCustomer(c);
        const extra = appearancesFor(x, data.trips);
        const have = {};
        (x.importedVisits || []).forEach((v) => { if (v && v.tripId) have[v.tripId] = true; });
        extra.forEach((v) => {
          if (v.tripId && have[v.tripId]) return;
          x.importedVisits = (x.importedVisits || []).concat([v]);
        });
        return x;
      });
    }
    let created = 0, updated = 0;
    incoming.forEach((raw) => {
      const c = emptyCustomer(raw);
      const up = upsertCustomer(st.customers, c);
      st.customers = up.customers;
      if (up.created) created++;
      else updated++;
      if (c.importedVisits && c.importedVisits.length) {
        const hit = up.customer;
        const have = {};
        (hit.importedVisits || []).forEach((v) => { if (v && v.tripId) have[v.tripId] = true; });
        c.importedVisits.forEach((v) => {
          if (!v) return;
          if (v.tripId && have[v.tripId]) return;
          hit.importedVisits = (hit.importedVisits || []).concat([v]);
          if (v.tripId) have[v.tripId] = true;
        });
      }
    });
    return { ok: true, state: st, created: created, updated: updated, total: incoming.length };
  }

  function diversDatabaseCSV(state, currency) {
    const st = state || emptyState();
    const cur = currency || (st.settings && st.settings.currency) || "JPY";
    const lines = [];
    lines.push("# BoatCloak return divers");
    lines.push("# Exported," + nowISO());
    lines.push("# Currency," + cur);
    lines.push(csvRow([
      "Name", "Phone", "Address", "Emergency name", "Emergency phone",
      "Cert agency", "Cert level", "Cert number", "Notes", "Trusted", "Trusted note",
      "Visits", "No-shows", "Trips rostered", "First visit", "Last visit",
      "Last activity", "Last instructor", "Last course",
      "Amount due", "Collected", "Outstanding",
    ]));
    sortDivers(st.customers || [], st.trips, "name").forEach((c) => {
      const h = customerHistory(c, st.trips);
      const last = h.appearances.length ? h.appearances[h.appearances.length - 1] : null;
      lines.push(csvRow([
        c.name, formatPhone(c.phone), c.address, c.emergencyName, formatPhone(c.emergencyPhone),
        c.certAgency, c.certLevel, c.certNumber, c.notes, isTrustedFlag(c.trusted) ? "yes" : "", c.trustedNote || "",
        h.visitCount, h.noShowCount, h.rosteredCount, h.firstVisit, h.lastVisit,
        last && last.activity ? (last.activity === "class" ? "Class" : "Fun diving") : "",
        last && last.instructor || "",
        last && last.course || "",
        h.due, h.collected, h.outstanding,
      ]));
    });
    return lines.join("\n") + "\n";
  }

  function parseCsv(text) {
    const rows = [];
    let row = [], cell = "", i = 0, inQ = false;
    const s = String(text || "").replace(/^\uFEFF/, "");
    while (i < s.length) {
      const ch = s[i];
      if (inQ) {
        if (ch === '"') {
          if (s[i + 1] === '"') { cell += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        cell += ch; i++; continue;
      }
      if (ch === '"') { inQ = true; i++; continue; }
      if (ch === ",") { row.push(cell); cell = ""; i++; continue; }
      if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && s[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = ""; i++; continue;
      }
      cell += ch; i++;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.some((c) => String(c).trim()));
  }

  function importDiversCSV(text, current) {
    const rows = parseCsv(text).filter((r) => !(r[0] && String(r[0]).charAt(0) === "#"));
    if (!rows.length) return { ok: false, error: "CSV is empty" };
    const header = rows[0].map((h) => String(h || "").trim().toLowerCase());
    const col = (...names) => {
      for (let i = 0; i < names.length; i++) {
        const n = names[i].toLowerCase();
        const idx = header.indexOf(n);
        if (idx >= 0) return idx;
      }
      return -1;
    };
    const iName = col("name");
    if (iName < 0) return { ok: false, error: "CSV needs a Name column" };
    const iPhone = col("phone");
    const iAddr = col("address");
    const iEn = col("emergency name", "emergencyname");
    const iEp = col("emergency phone", "emergencyphone");
    const iAg = col("cert agency", "agency");
    const iLv = col("cert level", "level");
    const iCn = col("cert number", "cert");
    const iNotes = col("notes");
    const iTrusted = col("trusted");
    const iTrustedNote = col("trusted note", "trustednote");
    const get = (row, i) => (i >= 0 && row[i] != null ? String(row[i]).trim() : "");
    const st = current ? clone(current) : emptyState();
    let created = 0, updated = 0;
    rows.slice(1).forEach((row) => {
      if (row[0] && String(row[0]).charAt(0) === "#") return;
      const rec = emptyCustomer({
        name: get(row, iName),
        phone: get(row, iPhone),
        address: get(row, iAddr),

        trusted: /^(yes|true|1)$/i.test(get(row, iTrusted)),

      });
      if (!rec.name) return;
      const up = upsertCustomer(st.customers, rec);
      st.customers = up.customers;
      if (up.created) created++;
      else updated++;
    });
    return { ok: true, state: st, created: created, updated: updated, total: created + updated };
  }

  function csvEscape(v) {
    const s = v == null ? "" : String(v);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function csvRow(cols) {
    return cols.map(csvEscape).join(",");
  }

  function tripManifestCSV(trip) {

    lines.push("# Divemaster," + csvEscape(trip.divemaster || ""));
    lines.push("# Exported," + formatJST(nowISO(), true));
    lines.push("");

        "Notes",
        "Activity",
        "Instructor",
        "Course",
        "Attendance",
        "Check-in time (JST)",
        "Added via",
      ])
    );
    (trip.divers || []).forEach((d) => {
      lines.push(
        csvRow([
          d.name,
          formatPhone(d.phone),
          d.certLevel,
          d.certAgency,
          d.certNumber,
          d.address,
          d.emergencyName,
          formatPhone(d.emergencyPhone),
          d.notes,
          activitySummary(d),
          normalizeActivity(d).instructor,

          d.checkedInAt ? formatJST(d.checkedInAt, true) : "",
          d.addedVia,
        ])
      );
    });
    const ac = attendanceCount(trip.divers);
    lines.push("");
    lines.push("# Attendance," + attendanceBanner(ac));
    lines.push("# Activity," + activityBanner(activityCount(trip.divers)));

  function tripPaymentsCSV(trip, currency) {
    const lines = [];
    lines.push("# BoatCloak trip payments");
    lines.push("# Date," + (trip.date || ""));
    lines.push("# Boat," + csvEscape(trip.boatName || ""));
    lines.push("# Exported," + formatJST(nowISO(), true));
    lines.push("");
    lines.push(csvRow(["Name", "Phone", "Status", "Amount due", "Collected", "Outstanding", "Method", "Note"]));
    (trip.divers || []).forEach((d) => {
      const p = normalizePayment(d.payment);
      const out = Math.max(0, p.amount - p.collected);
      lines.push(csvRow([d.name, formatPhone(d.phone), PAY_LABEL[p.status] || p.status, p.amount, p.collected, out, p.method, p.note]));
    });
    const t = paymentTotals(trip.divers);
    lines.push("");
    lines.push("# Totals due," + t.due);
    lines.push("# Collected," + t.collected);
    lines.push("# Outstanding," + t.outstanding);
    lines.push("# Currency," + (currency || "JPY"));
    return lines.join("\n") + "\n";
  }


  const SIGNUP_STATUSES = ["pending", "approved", "declined", "waitlist"];
  const SIGNUP_LABEL = { pending: "Pending", approved: "Approved", declined: "Declined", waitlist: "Waitlist" };
  const SIGNUP_REF_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  function makeSignupRef() {
    let s = "";
    for (let i = 0; i < 6; i++) s += SIGNUP_REF_CHARS.charAt(Math.floor(Math.random() * SIGNUP_REF_CHARS.length));
    return s;
  }

  function emptySignup(partial) {
    const o = Object.assign(
      {
        id: uid("su"),
        ref: "",
        tripId: "",
        name: "",
        phone: "",
        address: "",
        certLevel: "",
        certAgency: "",
        certNumber: "",
        emergencyName: "",
        emergencyPhone: "",
        notes: "",
        activity: "fun",
        instructor: "",
        course: "",
        status: "pending",
        createdAt: nowISO(),
        updatedAt: nowISO(),
        updatedBy: "",
        deleted: false,
        customerId: "",
        overbooked: false,
      },
      partial || {}
    );
    if (!o.ref) o.ref = makeSignupRef();
    if (SIGNUP_STATUSES.indexOf(o.status) < 0) o.status = "pending";
    o.activity = normalizeActivity(o).activity;
    o.instructor = normalizeActivity(o).instructor;
    o.course = normalizeActivity(o).course;
    o.deleted = !!o.deleted;
    o.overbooked = !!o.overbooked;
    o.capacity = o.capacity; // ignore
    return applyStoredPhones(normalizeTripRecord(o));
  }

  function rosterHeadcount(divers) {
    return (divers || []).filter((d) => d && !d.deleted && attendanceOf(d) !== "no_show").length;
  }

  function seatsLeft(trip) {
    if (!trip) return null;
    const cap = Number(trip.capacity) || 0;
    if (cap <= 0) return null;
    return Math.max(0, cap - rosterHeadcount(trip.divers));
  }

  function isOpenUpcoming(trip, today) {
    if (!trip || trip.deleted || !trip.openForSignup) return false;
    const day = normalizeTripDate(today || todayJST()) || todayJST();
    const tripDay = normalizeTripDate(trip.date);
    if (!tripDay) return false;
    return tripDay >= day;
  }

  function sanitizeOpenTrip(trip, today) {
    const left = seatsLeft(trip);
    return {
      id: trip && trip.id || "",
      date: normalizeTripDate(trip && trip.date) || "",
      boatName: trip && trip.boatName || "",
      sites: trip && trip.sites || "",
      departTime: normalizeDepartTime(trip && trip.departTime) || "",
      capacity: Number(trip && trip.capacity) || 0,
      seatsLeft: left,
      unlimited: left === null,
      priceNote: trip && trip.priceNote || "",
      publicNotes: trip && trip.publicNotes || "",
      open: isOpenUpcoming(trip, today),
    };
  }

  function sanitizeOpenTripList(trips, today) {
    const day = normalizeTripDate(today || todayJST()) || todayJST();
    return (trips || [])
      .filter((t) => isOpenUpcoming(t, day))
      .map((t) => sanitizeOpenTrip(t, day))
      .sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.departTime).localeCompare(String(b.departTime)));
  }

  function openTripHasPii(obj) {
    if (!obj || typeof obj !== "object") return false;
    const banned = ["phone", "address", "emergencyName", "emergencyPhone", "certNumber", "divers", "customers", "email", "trusted", "trustedNote"];
    return banned.some((k) => Object.prototype.hasOwnProperty.call(obj, k) && obj[k] != null && obj[k] !== "");
  }

  function publicSignupStatus(signup, trip) {
    return {
      ref: signup && signup.ref || "",
      status: signup && signup.status || "",
      tripDate: normalizeTripDate((trip && trip.date) || (signup && signup.tripDate) || ""),
      boatName: (trip && trip.boatName) || (signup && signup.boatName) || "",
      departTime: normalizeDepartTime((trip && trip.departTime) || (signup && signup.departTime) || ""),
    };
  }

  function pendingSignupCount(signups) {
    return (signups || []).filter((s) => s && !s.deleted && s.status === "pending").length;
  }

  function signupsForTrip(signups, tripId) {
    return (signups || []).filter((s) => s && !s.deleted && s.tripId === tripId);
  }

  function isReturningSignup(signup, customers) {
    if (!signup) return false;
    return (customers || []).some((c) => samePerson(signup, c));
  }

  function applySignupDecision(state, signupId, decision, opts) {
    opts = opts || {};
    const st = clone(state || emptyState());
    st.signups = (st.signups || []).map((s) => emptySignup(s));
    const su = st.signups.find((s) => s.id === signupId || s.ref === signupId);
    if (!su) return { ok: false, error: "Request not found" };
    if (SIGNUP_STATUSES.indexOf(decision) < 0) return { ok: false, error: "Unknown decision" };
    const trip = (st.trips || []).find((t) => t.id === su.tripId);
    if (decision === "approved") {
      if (!trip) return { ok: false, error: "Trip not found" };
      const already = alreadyOnTrip(su, trip.divers);
      if (!already.length) {
        const left = seatsLeft(trip);
        if (left !== null && left <= 0 && !opts.overbook) {
          return { ok: false, needOverbook: true, error: "This trip is full. Approve anyway as an overbook?" };
        }
      }
      const up = upsertCustomer(st.customers, {
        id: su.customerId || undefined,
        name: su.name,
        phone: su.phone,
        address: su.address,
        certLevel: su.certLevel,
        certAgency: su.certAgency,
        certNumber: su.certNumber,
        emergencyName: su.emergencyName,
        emergencyPhone: su.emergencyPhone,
        notes: su.notes,
      });
      st.customers = up.customers;
      su.customerId = up.customer.id;
      if (already.length) {
        if (already[0] && !already[0].customerId) already[0].customerId = up.customer.id;
        su.status = "approved";
        su.updatedAt = nowISO();
        su.updatedBy = opts.crewName || su.updatedBy || "";
        return { ok: true, state: st, signup: su, alreadyOnTrip: true, returning: !up.created };
      }
      const left = seatsLeft(trip);
      const diver = emptyDiver({
        name: su.name,
        phone: su.phone,
        address: su.address,
        certLevel: su.certLevel,
        certAgency: su.certAgency,
        certNumber: su.certNumber,
        emergencyName: su.emergencyName,
        emergencyPhone: su.emergencyPhone,
        notes: su.notes,
        activity: su.activity,
        instructor: su.instructor,
        course: su.course,
        customerId: up.customer.id,
        addedVia: "signup",
        payment: emptyPayment({ status: "unpaid" }),
        attendance: "not_checked_in",
        checkedInAt: null,
      });
      trip.divers = (trip.divers || []).concat([diver]);
      trip.log = trip.log || [];
      trip.log.push(logEntry("add", diver.name + " approved from sign-up" + (opts.overbook ? " (overbook)" : "")));
      su.overbooked = !!(opts.overbook && left !== null && left <= 0);
      su.status = "approved";
      su.updatedAt = nowISO();
      su.updatedBy = opts.crewName || su.updatedBy || "";
      return { ok: true, state: st, signup: su, diver: diver, returning: !up.created, overbooked: su.overbooked };
    }
    su.status = decision;
    su.updatedAt = nowISO();
    su.updatedBy = opts.crewName || su.updatedBy || "";
    return { ok: true, state: st, signup: su };
  }

  function validatePersonInput(rec) {
    const errors = [];
    const name = String((rec && rec.name) || "").trim();
    const address = String((rec && rec.address) || "").trim();
    if (name.length < 2) errors.push("Name is required");
    if (name.length > 80) errors.push("Name is too long");
    if (!address) errors.push("Address is required");
    if (address.length > 400) errors.push("Address is too long");
    return { ok: errors.length === 0, errors: errors, error: errors[0] || "" };
  }

  function validateSignupInput(rec, opts) {
    opts = opts || {};
    const person = validatePersonInput(rec);
    const errors = person.errors.slice();
    const phone = phoneDigits(rec && rec.phone);
    if (phone.length < 7) errors.push("A phone number is required so the crew can reach you");
    if (phone.length > 20) errors.push("Phone number is too long");
    const lens = [
      ["notes", 500], ["emergencyName", 80], ["emergencyPhone", 32],
      ["certLevel", 80], ["certAgency", 40], ["certNumber", 40], ["instructor", 80], ["course", 80],
    ];
    lens.forEach((pair) => {
      const k = pair[0], max = pair[1];
      if (String((rec && rec[k]) || "").length > max) errors.push(k + " is too long");
    });
    if (!(rec && rec.tripId) && !opts.allowNoTrip) errors.push("Choose a trip");
    return { ok: errors.length === 0, errors: errors, error: errors[0] || "" };
  }


  /* Fill syncUrl from the public site config when the phone has none.
     Never copies registerKey into crewKey. Never overwrites a URL already set. */
  function applySiteSyncUrl(settings, publicConfig) {
    const next = Object.assign({}, settings || {});
    const existing = String(next.syncUrl || "").trim();
    const siteUrl = publicConfig && publicConfig.syncUrl ? String(publicConfig.syncUrl).trim() : "";
    if (existing) {
      return {
        settings: next,
        changed: false,
        fromSite: !!(siteUrl && existing === siteUrl),
      };
    }
    if (!siteUrl) {
      return { settings: next, changed: false, fromSite: false };
    }
    next.syncUrl = siteUrl;
    return { settings: next, changed: true, fromSite: true };
  }

  function isPublicRegisterKey(crewKey, publicConfig) {
    const key = String(crewKey || "").trim();
    const reg = publicConfig && publicConfig.registerKey ? String(publicConfig.registerKey).trim() : "";
    return !!(key && reg && key === reg);
  }


  function parseRegisterHash(hash) {
    const raw = String(hash || "");
    const h = (raw.charAt(0) === "#" ? raw.slice(1) : raw);
    const qIndex = h.indexOf("?");
    const path = (qIndex >= 0 ? h.slice(0, qIndex) : h).replace(/^\//, "").toLowerCase();
    const query = qIndex >= 0 ? h.slice(qIndex + 1) : "";
    const register = path === "register" || path === "reg";
    let tripId = "";
    if (register && query) {
      query.split("&").forEach((part) => {
        const eq = part.indexOf("=");
        const k = decodeURIComponent((eq >= 0 ? part.slice(0, eq) : part).replace(/\+/g, " ")).toLowerCase();
        const v = decodeURIComponent((eq >= 0 ? part.slice(eq + 1) : "").replace(/\+/g, " "));
        if (k === "trip") tripId = String(v || "").trim();
      });
    }
    return { register: register, tripId: tripId };
  }

  function registerUrlFor(base, tripId) {
    const hash = String(tripId || "").trim()
      ? "#register?trip=" + encodeURIComponent(String(tripId).trim())
      : "#register";
    const b = String(base || "").trim();
    if (!b) return hash;
    if (/\.html?$/i.test(b)) return b + hash;
    return b.replace(/\/+$/, "") + "/" + hash;
  }

  function resolveRegisterTrip(trips, tripId) {
    const list = Array.isArray(trips) ? trips : [];
    const wanted = String(tripId || "").trim();
    const firstId = (list[0] && list[0].id) || "";
    if (!wanted) return { status: "none", trip: null, selectedId: firstId, message: "" };
    const trip = list.find((t) => t && String(t.id) === wanted) || null;
    if (!trip) {
      return {
        status: "unavailable",
        trip: null,
        selectedId: firstId,
        message: "That trip is not open for sign-up. It may be closed or the link may be out of date. Choose from the open trips below.",
      };
    }
    const full = !trip.unlimited && trip.seatsLeft != null && Number(trip.seatsLeft) <= 0;
    if (full) {
      return {
        status: "full",
        trip: trip,
        selectedId: trip.id,
        message: "This trip is full. You can request a waitlist spot or pick another open trip.",
      };
    }
    return { status: "ok", trip: trip, selectedId: trip.id, message: "" };
  }

  function importState(jsonText, current) {
    let data;
    try {
      data = typeof jsonText === "string" ? JSON.parse(jsonText) : jsonText;
    } catch (e) {
      return { ok: false, error: "Backup is not valid JSON" };
    }
    if (!data || typeof data !== "object") return { ok: false, error: "Backup is empty" };
    if (data.app && !isOurAppName(data.app)) {
      return { ok: false, error: "This file is not a BoatCloak backup" };
    }
    const next = emptyState();
    next.settings = Object.assign(next.settings, data.settings || {});
    ["syncUrl", "crewKey", "crewName", "registerKey", "lastSyncAt"].forEach((k) => {
      if (data.settings && data.settings[k] != null) next.settings[k] = data.settings[k];
    });
    next.customers = Array.isArray(data.customers) ? data.customers.map((c) => emptyCustomer(c)) : [];
    next.trips = Array.isArray(data.trips)
      ? data.trips.map((t) => {
          const trip = emptyTrip(t);
          trip.divers = (t.divers || []).map((d) => {
            const x = emptyDiver(d);
            x.payment = normalizePayment(d.payment);
            return x;
          });
          trip.log = Array.isArray(t.log) ? t.log : [];
          return trip;
        })
      : [];
    next.currentTripId = data.currentTripId || (next.trips[0] && next.trips[0].id) || null;
    next.instructors = Array.isArray(data.instructors)
      ? data.instructors.map((s) => String(s || "").trim()).filter(Boolean)
      : [];
    next.trips.forEach((trip) => {
      (trip.divers || []).forEach((d) => {
        const inst = normalizeActivity(d).instructor;
        if (inst) next.instructors = upsertInstructor(next.instructors, inst);
      });
    });
    next.outbox = Array.isArray(data.outbox) ? data.outbox : [];
    next.pendingRegs = Array.isArray(data.pendingRegs) ? data.pendingRegs : [];
    next.signups = Array.isArray(data.signups) ? data.signups.map((s) => emptySignup(s)) : [];
    next.schema = SCHEMA;
    return { ok: true, state: next };
  }

    if (Math.abs(a.length - b.length) > 2 && Math.max(a.length, b.length) > 4) return 99;
    const rows = [];
    for (let i = 0; i <= b.length; i++) rows[i] = [i];

<script>
/* BoatCloak shared sync — offline-first outbox + last-write-wins merge.

(function (root, factory) {

  function crewNameOf(state) {
    return (state && state.settings && state.settings.crewName) || "";
  }

  function stamp(rec, crewName, force) {
    const out = Object.assign({}, rec);
    if (!out.id) out.id = uid("r");
    if (force || !out.updatedAt) out.updatedAt = nowISO();
    if (force || !out.updatedBy) out.updatedBy = crewName || out.updatedBy || "";

  function newer(a, b) {
    const ta = (a && a.updatedAt) || "";

  function asBool(v) {

    const s = String(v || "").toLowerCase();

  function indexById(list) {
    const map = {};

  function instructorId(name) {

    (st.customers || []).forEach((c) => {

    (st.trips || []).forEach((t) => {
      trips.push(stamp({
        id: t.id,
        date: t.date || "",
        boatName: t.boatName || "",
        sites: t.sites || "",
        divemaster: t.divemaster || "",
        notes: t.notes || "",
        log: t.log || [],
        createdAt: t.createdAt || "",
        updatedAt: t.updatedAt,
        updatedBy: t.updatedBy,
        deleted: !!t.deleted,
        openForSignup: !!t.openForSignup,
        departTime: t.departTime || "",
        capacity: Number(t.capacity) || 0,
        priceNote: t.priceNote || "",
        publicNotes: t.publicNotes || "",
      }, crew, false));
      (t.divers || []).forEach((d) => {
        const pay = (C && C.normalizePayment ? C.normalizePayment(d.payment) : (d.payment || {}));
        const act = (C && C.normalizeActivity ? C.normalizeActivity(d) : d);
        roster.push(stamp({
          id: d.id,
          tripId: t.id,
          customerId: d.customerId || "",
          name: d.name || "",
          phone: d.phone || "",
          address: d.address || "",
          certLevel: d.certLevel || "",
          certAgency: d.certAgency || "",
          certNumber: d.certNumber || "",
          emergencyName: d.emergencyName || "",
          emergencyPhone: d.emergencyPhone || "",
          notes: d.notes || "",
          attendance: d.attendance || "not_checked_in",
          checkedInAt: d.checkedInAt || "",
          activity: act.activity || "fun",
          instructor: act.instructor || "",
          course: act.course || "",
          payStatus: pay.status || "unpaid",
          payAmount: pay.amount || 0,
          payCollected: pay.collected || 0,
          payMethod: pay.method || "",
          payNote: pay.note || "",
          addedVia: d.addedVia || "",
          addedAt: d.addedAt || "",
          updatedAt: d.updatedAt,

      const n = String(name || "").trim();

        id: instructorId(n),
        name: n,
        updatedAt: "",
        updatedBy: crew,
        deleted: false,

    const pending = (st.pendingRegs || []).map((p) => stamp(Object.assign({}, p), crew, false));
    const signups = (st.signups || []).map((s) => stamp(Object.assign({}, s), crew, false));
    return { divers: divers, trips: trips, roster: roster, visits: visits, instructors: instructors, pending: pending, signups: signups };
  }

  /* Compare previous flatten to current, stamp changed records, and enqueue. */
  function captureChanges(state, prevFlat) {
    const crew = crewNameOf(state);
    const next = flatten(state);
    const prev = prevFlat || { divers: [], trips: [], roster: [], visits: [], instructors: [], pending: [] };
    state.outbox = state.outbox || [];
    const enqueue = (collection, record, op) => {
      const stamped = stamp(Object.assign({}, record), crew, true);
      if (op === "delete") stamped.deleted = true;
      state.outbox = state.outbox.filter((x) => !(x.collection === collection && x.record && x.record.id === stamped.id));
      state.outbox.push({ id: uid("ob"), collection: collection, op: op || "upsert", record: stamped, queuedAt: stamped.updatedAt });

      const pmap = indexById(prev[col]);
      const nmap = indexById(next[col]);

        if (contentKey(pmap[id]) !== contentKey(nmap[id])) {
          const stamped = enqueue(col, nmap[id], "upsert");
          writeStampBack(state, col, stamped);

  }

  function writeStampBack(state, collection, rec) {
    if (!rec || !rec.id) return;
    if (collection === "divers") {
      const c = (state.customers || []).find((x) => x.id === rec.id);
      if (c) { c.updatedAt = rec.updatedAt; c.updatedBy = rec.updatedBy; }
    } else if (collection === "trips") {
      const t = (state.trips || []).find((x) => x.id === rec.id);
      if (t) { t.updatedAt = rec.updatedAt; t.updatedBy = rec.updatedBy; }
    } else if (collection === "roster") {
      (state.trips || []).forEach((t) => {
        const d = (t.divers || []).find((x) => x.id === rec.id);

    const map = indexById(localList);
